<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>明月松间照，清泉石上流 · 三维诗境</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #04070d; }
  body { font-family: "Kaiti SC", "STKaiti", "KaiTi", "Songti SC", "Noto Serif SC", serif; }
  canvas { display: block; }

  /* ---------- 载入遮罩 ---------- */
  #veil {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
    background: #04070d; transition: opacity 1.4s ease;
  }
  #veil.hide { opacity: 0; pointer-events: none; }
  #veil .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(150, 180, 220, .16); border-top-color: rgba(200, 220, 255, .8);
    animation: spin 1.1s linear infinite;
  }
  #veil .tip { color: rgba(185, 202, 224, .55); font-size: 13px; letter-spacing: .45em; text-indent: .45em; }
  #veil .err { color: #d9907e; font-size: 13px; letter-spacing: .1em; line-height: 1.9; max-width: 72vw; text-align: center; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 左上题签 ---------- */
  #brand {
    position: fixed; top: 28px; left: 32px; z-index: 10;
    color: rgba(200, 216, 238, .48); font-size: 12px; letter-spacing: .5em;
    text-shadow: 0 0 12px rgba(120, 165, 230, .25);
    opacity: 0; animation: fadein 2s ease .4s forwards;
  }

  /* ---------- 右侧竖排诗文 ---------- */
  #poem {
    position: fixed; top: 50%; right: 5.5vw; transform: translateY(-50%); z-index: 10;
    writing-mode: vertical-rl;
    display: flex; flex-direction: column; align-items: center; gap: 30px;
    pointer-events: none;
  }
  #poem .title {
    font-size: 27px; letter-spacing: .4em;
    color: rgba(238, 243, 249, .92);
    text-shadow: 0 0 20px rgba(150, 190, 255, .4), 0 0 2px rgba(255, 255, 255, .35);
  }
  #poem .author { font-size: 13px; letter-spacing: .55em; color: rgba(196, 212, 232, .55); }
  #poem .verse {
    font-size: 19px; letter-spacing: .52em;
    color: rgba(224, 233, 245, .85);
    text-shadow: 0 0 16px rgba(140, 182, 240, .32);
  }
  #poem .seal {
    writing-mode: vertical-rl;
    background: #9e3b2e; color: #f2e7d6;
    font-size: 12px; padding: 8px 5px; letter-spacing: .2em;
    border-radius: 3px; box-shadow: 0 0 14px rgba(158, 59, 46, .4);
    opacity: .82;
  }
  #poem > * { opacity: 0; animation: rise 1.7s ease forwards; }
  #poem .title  { animation-delay: .7s; }
  #poem .author { animation-delay: 1.1s; }
  #poem .verse:nth-of-type(1) { animation-delay: 1.5s; }
  #poem .verse:nth-of-type(2) { animation-delay: 1.9s; }
  #poem .seal   { animation-delay: 2.4s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* ---------- 操作提示 ---------- */
  #hint {
    position: fixed; left: 32px; bottom: 26px; z-index: 10;
    color: rgba(185, 202, 224, .5); font-size: 12px; letter-spacing: .3em;
    opacity: 0; animation: fadein 1.6s ease 2.8s forwards; transition: opacity 1.2s ease;
  }

  /* ---------- 暗角 ---------- */
  #vignette {
    position: fixed; inset: 0; z-index: 5; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(2, 5, 10, .58) 100%);
  }
</style>
</head>
<body>

<div id="veil">
  <div class="ring"></div>
  <div class="tip">松风明月 · 载入中</div>
  <div class="err" id="verr"></div>
</div>

<div id="brand">诗 境 · 三 维</div>

<div id="poem">
  <div class="title">山居秋暝</div>
  <div class="author">唐 · 王维</div>
  <div class="verse">明月松间照</div>
  <div class="verse">清泉石上流</div>
  <div class="seal">王维印</div>
</div>

<div id="hint">拖 动 环 视 · 滚 轮 探 幽</div>
<div id="vignette"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
const veil = document.getElementById('veil');
const verr = document.getElementById('verr');
const hintEl = document.getElementById('hint');

init().catch(err => {
  console.error(err);
  veil.querySelector('.ring').style.display = 'none';
  veil.querySelector('.tip').style.display = 'none';
  verr.style.display = 'block';
  verr.textContent = '场景载入失败：' + (err && err.message ? err.message : err) + '（需联网加载 three.js）';
});

async function init() {
  let THREE, OrbitControls, mergeGeometries, EffectComposer, RenderPass, UnrealBloomPass, OutputPass;
  try {
    THREE = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ mergeGeometries } = await import('three/addons/utils/BufferGeometryUtils.js'));
    ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
    ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
    ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
    ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
  } catch (e) { throw new Error('three.js 资源加载失败'); }

  /* ================================================================
     一、可复现随机 & 噪声工具
  ================================================================ */
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(20240915);

  function hash2(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
  function hash3(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
  function vnoise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    return hash2(ix, iy) * (1 - ux) * (1 - uy) + hash2(ix + 1, iy) * ux * (1 - uy)
         + hash2(ix, iy + 1) * (1 - ux) * uy + hash2(ix + 1, iy + 1) * ux * uy;
  }
  function fbm2(x, y) {
    let v = 0, a = 0.5;
    for (let i = 0; i < 4; i++) { v += a * vnoise2(x, y); x = x * 2.03 + 11.7; y = y * 2.03 - 7.3; a *= 0.5; }
    return v;
  }
  const sstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;

  /* ================================================================
     二、地形骨架：山峦 + 一条蜿蜒的清泉
  ================================================================ */
  // 泉流中轴线（大致沿 Z 轴蜿蜒）
  function centerX(z) { return Math.sin(z * 0.08) * 4.5 + Math.sin(z * 0.021 + 2.0) * 3.5; }
  function dCenterX(z) { return Math.cos(z * 0.08) * 0.36 + Math.cos(z * 0.021 + 2.0) * 0.0735; }
  // 河床底部高度
  function floorH(z) { return -1.6 + Math.sin(z * 0.045) * 0.25 + z * 0.004; }
  function waterY(z) { return floorH(z) + 0.45; }
  // 两岸大地
  function hBase(x, z) {
    let h = fbm2(x * 0.018 + 3.7, z * 0.018 - 2.1) * 5.0 + fbm2(x * 0.05, z * 0.05) * 1.3 + 0.9;
    h += sstep(10, 42, -x) * 4.2;    // 左侧山势（松林坡）
    h += sstep(30, 78, -z) * 6.0;    // 远山
    h += sstep(16, 48, x) * 2.4;     // 右侧缓丘
    h += sstep(24, 62, z) * 2.2;     // 身后微隆
    return Math.max(h, -0.4);
  }
  function terrainH(x, z) {
    const d = Math.abs(x - centerX(z));
    const t = sstep(2.0, 6.5, d);
    return lerp(floorH(z), hBase(x, z), t);
  }

  /* ================================================================
     三、渲染器 / 场景 / 相机 / 灯光
  ================================================================ */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) { throw new Error('当前环境不支持 WebGL'); }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a1626, 0.011);

  const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 800);
  camera.position.set(7.5, 5.2, 15.5);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.6, -8);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 30;
  controls.minPolarAngle = 0.25;
  controls.maxPolarAngle = 1.50;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.22;
  let idleTimer = null;
  controls.addEventListener('start', () => { controls.autoRotate = false; if (idleTimer) clearTimeout(idleTimer); });
  controls.addEventListener('end', () => { idleTimer = setTimeout(() => { controls.autoRotate = true; }, 9000); });

  // 月亮的位置（挂在远山之后的天际）
  const MOON_POS = new THREE.Vector3(-34, 46, -165);

  const moonLight = new THREE.DirectionalLight(0xb8d0f0, 1.25);
  moonLight.position.copy(MOON_POS);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(2048, 2048);
  moonLight.shadow.camera.left = -55; moonLight.shadow.camera.right = 55;
  moonLight.shadow.camera.top = 45; moonLight.shadow.camera.bottom = -45;
  moonLight.shadow.camera.near = 40; moonLight.shadow.camera.far = 300;
  moonLight.shadow.bias = -0.0006;
  moonLight.shadow.normalBias = 0.5;
  scene.add(moonLight);
  scene.add(moonLight.target);

  scene.add(new THREE.HemisphereLight(0x223349, 0x0c1410, 0.32));
  const streamGlow = new THREE.PointLight(0x6f9cc4, 40, 42, 2);
  streamGlow.position.set(3, 6.5, 2);
  scene.add(streamGlow);

  /* ================================================================
     四、画布纹理工具（月面 / 光晕 / 光柱）
  ================================================================ */
  function makeMoonTexture() {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    const base = g.createRadialGradient(S/2, S/2, 10, S/2, S/2, S/2);
    base.addColorStop(0, '#fffdf4'); base.addColorStop(0.8, '#f7f0dc'); base.addColorStop(1, '#eae2ca');
    g.fillStyle = base; g.fillRect(0, 0, S, S);
    // 月海
    for (let i = 0; i < 9; i++) {
      const x = S*0.2 + rng()*S*0.6, y = S*0.2 + rng()*S*0.6, r = 18 + rng()*42;
      g.fillStyle = `rgba(150,156,172,${0.08 + rng()*0.08})`;
      g.beginPath(); g.ellipse(x, y, r, r*(0.6+rng()*0.5), rng()*Math.PI, 0, Math.PI*2); g.fill();
    }
    // 环形山
    for (let i = 0; i < 26; i++) {
      const x = rng()*S, y = rng()*S, r = 2 + rng()*7;
      g.fillStyle = `rgba(112,120,138,${0.10 + rng()*0.14})`;
      g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
      g.fillStyle = `rgba(255,252,240,${0.10 + rng()*0.10})`;
      g.beginPath(); g.arc(x - r*0.35, y - r*0.35, r*0.55, 0, Math.PI*2); g.fill();
    }
    // 边缘暗化
    const limb = g.createRadialGradient(S/2, S/2, S*0.30, S/2, S/2, S/2);
    limb.addColorStop(0, 'rgba(0,0,0,0)'); limb.addColorStop(1, 'rgba(78,88,112,0.42)');
    g.fillStyle = limb; g.fillRect(0, 0, S, S);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function makeGlowTexture(inner, mid) {
    const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
    grad.addColorStop(0, `rgba(255,255,255,${inner})`);
    grad.addColorStop(0.25, `rgba(255,255,255,${mid})`);
    grad.addColorStop(0.55, 'rgba(255,255,255,0.10)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.fillRect(0, 0, S, S);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }

  function makeBeamTexture() {
    const W = 128, H = 256, c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    const img = g.createImageData(W, H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = (y * W + x) * 4;
        const ax = Math.sin((x / W) * Math.PI);
        const ay = Math.pow(1 - y / H, 1.6);
        const a = Math.pow(ax, 1.5) * ay;
        img.data[i] = 178; img.data[i+1] = 205; img.data[i+2] = 246;
        img.data[i+3] = Math.round(a * 255);
      }
    }
    g.putImageData(img, 0, 0);
    return new THREE.CanvasTexture(c);
  }

  /* ================================================================
     五、夜空：天穹渐变 · 星河 · 流星
  ================================================================ */
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      uZenith:  { value: new THREE.Color(0x040810) },
      uMid:     { value: new THREE.Color(0x0a1626) },
      uHorizon: { value: new THREE.Color(0x14283c) },
      uMoonPos: { value: MOON_POS },
      uHalo:    { value: new THREE.Color(0x35506e) },
    },
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uZenith, uMid, uHorizon, uMoonPos, uHalo;
      varying vec3 vDir;
      void main() {
        vec3 d = normalize(vDir);
        float h = clamp(d.y, -0.05, 1.0);
        vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.28, h));
        col = mix(col, uZenith, smoothstep(0.25, 0.85, h));
        vec3 md = normalize(uMoonPos);
        float az = max(dot(normalize(vec3(d.x, 0.0, d.z)), normalize(vec3(md.x, 0.0, md.z))), 0.0);
        col += uHalo * pow(az, 6.0) * exp(-h * 2.2) * 0.5;
        col += vec3(0.045, 0.065, 0.095) * exp(-abs(h - 0.05) * 14.0) * 0.6;
        gl_FragColor = vec4(col, 1.0);
      }`,
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(340, 32, 24), skyMat);
  sky.renderOrder = -10;
  sky.frustumCulled = false;
  scene.add(sky);

  // ---- 星空 ----
  const STAR_COUNT = 850;
  {
    const pos = new Float32Array(STAR_COUNT * 3);
    const size = new Float32Array(STAR_COUNT);
    const phase = new Float32Array(STAR_COUNT);
    const col = new Float32Array(STAR_COUNT * 3);
    const palette = [
      new THREE.Color(0xcfd8ff), new THREE.Color(0xcfd8ff),
      new THREE.Color(0xffe9c4), new THREE.Color(0xaac4ff), new THREE.Color(0xf5f8ff),
    ];
    let i = 0;
    while (i < STAR_COUNT) {
      const v = new THREE.Vector3(rng()*2-1, rng(), rng()*2-1);
      if (v.lengthSq() < 0.01) continue;
      v.normalize();
      if (v.y < 0.03) continue;
      pos[i*3] = v.x * 290; pos[i*3+1] = v.y * 290; pos[i*3+2] = v.z * 290;
      size[i] = 1.3 + Math.pow(rng(), 2) * 2.9;
      phase[i] = rng();
      const c = palette[(rng() * palette.length) | 0];
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
      i++;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    var starMat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      uniforms: { uTime: { value: 0 } },
      vertexShader: /* glsl */`
        attribute float aSize; attribute float aPhase; attribute vec3 aColor;
        uniform float uTime;
        varying vec3 vColor; varying float vTw;
        void main() {
          vColor = aColor;
          vTw = 0.68 + 0.32 * sin(uTime * (0.5 + aPhase * 1.1) + aPhase * 40.0);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aSize * (330.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying vec3 vColor; varying float vTw;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.06, d);
          gl_FragColor = vec4(vColor * vTw, a * vTw);
        }`,
    });
    const stars = new THREE.Points(g, starMat);
    stars.renderOrder = -9;
    scene.add(stars);
  }

  // ---- 流星 ----
  const SS_COUNT = 26;
  const ss = {
    active: false, nextAt: 9, t0: 0, life: 1.2, speed: 130,
    p0: new THREE.Vector3(), dir: new THREE.Vector3(),
    mat: null, geo: null,
  };
  {
    const pos = new Float32Array(SS_COUNT * 3);
    const at = new Float32Array(SS_COUNT);
    for (let i = 0; i < SS_COUNT; i++) at[i] = i / (SS_COUNT - 1);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aT', new THREE.BufferAttribute(at, 1));
    ss.geo = g;
    ss.mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false,
      uniforms: { uAlpha: { value: 0 }, uColor: { value: new THREE.Color(0xdff3ff) } },
      vertexShader: /* glsl */`
        attribute float aT;
        uniform float uPixel;
        varying float vA;
        void main() {
          vA = pow(1.0 - aT, 1.8);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = uPixel * (300.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        uniform float uAlpha; uniform vec3 uColor;
        varying float vA;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.0, d);
          gl_FragColor = vec4(uColor, a * vA * uAlpha);
        }`,
    });
    ss.mat.uniforms.uPixel = { value: 2.6 };
    const pts = new THREE.Points(g, ss.mat);
    pts.renderOrder = -8;
    pts.frustumCulled = false;
    scene.add(pts);
  }
  function updateShootingStar(t, dt) {
    if (!ss.active && t > ss.nextAt) {
      ss.active = true; ss.t0 = t;
      ss.life = 1.1 + rng() * 0.5;
      const a = rng() * Math.PI * 2;
      ss.p0.set(Math.cos(a) * 190, 60 + rng() * 75, Math.sin(a) * 190);
      ss.dir.set(rng() - 0.5, -(0.42 + rng() * 0.3), rng() - 0.5).normalize();
    }
    if (ss.active) {
      const p = (t - ss.t0) / ss.life;
      if (p >= 1) {
        ss.active = false; ss.nextAt = t + 10 + rng() * 22;
        ss.mat.uniforms.uAlpha.value = 0;
      } else {
        ss.mat.uniforms.uAlpha.value = Math.sin(Math.PI * p) * 0.9;
        const head = ss.p0.clone().addScaledVector(ss.dir, ss.speed * (t - ss.t0));
        const arr = ss.geo.attributes.position;
        for (let i = 0; i < SS_COUNT; i++) {
          arr.setXYZ(i, head.x - ss.dir.x * i * 2.2, head.y - ss.dir.y * i * 2.2, head.z - ss.dir.z * i * 2.2);
        }
        arr.needsUpdate = true;
      }
    }
  }

  /* ================================================================
     六、明月与清辉
  ================================================================ */
  const moonMat = new THREE.MeshBasicMaterial({ map: makeMoonTexture(), fog: false });
  moonMat.color.setRGB(1.6, 1.56, 1.42);
  const moon = new THREE.Mesh(new THREE.SphereGeometry(9, 40, 32), moonMat);
  moon.position.copy(MOON_POS);
  moon.renderOrder = -7;

  // ---- 远山剪影（月亮从山脊上升起）----

  // ---- 林间月色光柱 ----
  const beams = [];

  /* ================================================================

  {

    const cWet = new THREE.Color(0x0e1813), cRock = new THREE.Color(0x39414b);

      const wy = waterY(z);

      // 苔原 ↔ 泥土
      tmp.copy(cDirt).lerp(cMoss, sstep(0.35, 0.65, fbm2(x * 0.045 + 5, z * 0.045)));

  /* ================================================================
     八、清泉：自定义水面着色器（流动 · 月光粼粼 · 石畔白沫）
  ================================================================ */
  const inStreamRocks = [];   // 记录水中石块，供泡沫着色器使用
  const waterUniforms = {
    uTime:      { value: 0 },
    uMoonPos:   { value: MOON_POS },
    uCamPos:    { value: camera.position },
    uDeep:      { value: new THREE.Color(0x0d2431) },
    uShallow:   { value: new THREE.Color(0x16404a) },
    uSky:       { value: new THREE.Color(0x24455e) },
    uMoonColor: { value: new THREE.Color(0xeaf4ff) },
    uFogColor:  { value: new THREE.Color(0x0a1626) },
    uFogDensity:{ value: 0.011 },
    uRocks:     { value: Array.from({ length: 12 }, () => new THREE.Vector3()) },
    uRockR:     { value: new Array(12).fill(0) },
    uRockCount: { value: 0 },
  };

  let waterMesh = null;
  function buildWater() {
    const zs = [];
    for (let z = -72; z <= 48; z += 0.75) zs.push(z);
    const WSEG = 6;
    const cols = zs.length, rows = WSEG + 1;
    const posArr = new Float32Array(cols * rows * 3);
    const uvArr = new Float32Array(cols * rows * 2);
    const flowArr = new Float32Array(cols * rows * 2);
    const idx = [];

    for (let ci = 0; ci < cols; ci++) {
      const z = zs[ci];
      const cx = centerX(z);
      const tl = Math.hypot(dCenterX(z), 1);
      const fx = dCenterX(z) / tl, fz = 1 / tl;
      const halfW = 4.6 + Math.sin(z * 0.11 + 1.3) * 0.35;
      const y = waterY(z);
      for (let ri = 0; ri <= WSEG; ri++) {
        const u = ri / WSEG;
        const x = cx + (u - 0.5) * 2 * halfW;
        const k = ci * rows + ri;
        posArr[k*3] = x; posArr[k*3+1] = y; posArr[k*3+2] = z;
        uvArr[k*2] = u; uvArr[k*2+1] = z * 0.01;
        flowArr[k*2] = fx; flowArr[k*2+1] = fz;
      }
    }
    for (let ci = 0; ci < cols - 1; ci++) {
      for (let ri = 0; ri < WSEG; ri++) {
        const a = ci * rows + ri, b = a + 1, c = a + rows, d = c + 1;
        idx.push(a, c, b, b, c, d);
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
    g.setAttribute('aFlow', new THREE.BufferAttribute(flowArr, 2));
    g.setIndex(idx);

    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: waterUniforms,
      vertexShader: /* glsl */`
        uniform float uTime;
        attribute vec2 aFlow;
        varying vec3 vWorld;
        varying vec2 vUv;
        varying vec2 vFlow;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          float r = sin(wp.x * 2.1 + wp.z * 1.7 + uTime * 1.4) * 0.5
                  + sin(wp.x * 3.7 - wp.z * 2.9 - uTime * 2.2) * 0.5;
          wp.y += r * 0.035;
          vWorld = wp.xyz; vUv = uv; vFlow = aFlow;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }`,
      fragmentShader: /* glsl */`
        uniform float uTime;
        uniform vec3 uMoonPos, uCamPos;
        uniform vec3 uDeep, uShallow, uSky, uMoonColor, uFogColor;
        uniform float uFogDensity;
        uniform vec3 uRocks[12];
        uniform float uRockR[12];
        uniform int uRockCount;
        varying vec3 vWorld;
        varying vec2 vUv;
        varying vec2 vFlow;

        float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
        float vnoise(vec2 p) {
          vec2 i = floor(p), f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
                     mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
        }
        float fbm(vec2 p) {
          float v = 0.0, a = 0.5;
          for (int i = 0; i < 3; i++) { v += a * vnoise(p); p = p * 2.03 + 7.7; a *= 0.5; }
          return v;
        }
        // 沿流向滚动的波高场
        float wheight(vec2 p, vec2 flow, float t) {
          vec2 s = vec2(dot(p, vec2(-flow.y, flow.x)), dot(p, flow));
          float h = fbm(vec2(s.x * 1.5, s.y * 1.5 - t * 1.05));
          h += fbm(vec2(s.x * 3.4 + 7.3, s.y * 3.4 - t * 1.9)) * 0.45;
          h += vnoise(vec2(s.x * 7.0, s.y * 7.0 - t * 3.2)) * 0.12;
          h += sin(s.y * 0.5 - t * 0.6) * 0.06;
          return h;
        }

        void main() {
          vec2 p = vWorld.xz;
          float t = uTime;
          float e = 0.09;
          float h0 = wheight(p, vFlow, t);
          float hx = wheight(p + vec2(e, 0.0), vFlow, t);
          float hz = wheight(p + vec2(0.0, e), vFlow, t);
          vec3 n = normalize(vec3((h0 - hx) / e * 0.35, 1.0, (h0 - hz) / e * 0.35));

          vec3 V = normalize(uCamPos - vWorld);
          float fres = pow(1.0 - max(dot(n, V), 0.0), 3.0);

          // 水色：深处幽蓝，近岸清浅
          float depthF = smoothstep(0.95, 0.1, abs(vUv.x - 0.5) * 2.0);
          vec3 col = mix(uDeep, uShallow, clamp(h0 * 0.55 + 0.35, 0.0, 1.0));
          col = mix(col, uSky, fres * 0.65);

          // 月光：粼粼波光 + 一条随视线延展的月径
          vec3 L = normalize(uMoonPos - vWorld);
          vec3 R = reflect(-V, n);
          float align = max(dot(R, L), 0.0);
          float sparkle = vnoise(p * 6.0 + vec2(t * 2.0, -t * 2.4));
          float glint = pow(align, 380.0) * (0.55 + 1.3 * pow(sparkle, 3.0));
          float path  = pow(align, 28.0) * 0.30;
          col += uMoonColor * (glint * 2.2 + path);
          col += uMoonColor * max(dot(n, L), 0.0) * 0.10;

          // 石畔白沫（绕石翻涌的环）
          float foam = 0.0;
          for (int i = 0; i < 12; i++) {
            if (i >= uRockCount) break;
            vec2 rp = uRocks[i].xz;
            float rad = uRockR[i];
            float d = length(p - rp);
            float ring = smoothstep(rad + 0.34, rad + 0.04, d) * smoothstep(rad - 0.22, rad + 0.06, d);
            float wob = fbm(p * 3.0 + vec2(t * 0.7, -t * 0.9));
            foam += ring * (0.3 + 0.5 * wob);
          }
          // 岸缘碎沫（顺流而下的细带）
          float edge = abs(vUv.x - 0.5) * 2.0;
          float bank = smoothstep(0.66, 0.98, edge);
          float streak = fbm(vec2(edge * 5.0, dot(p, vFlow) * 0.9 - t * 1.4));
          foam += smoothstep(0.42, 0.85, bank * (0.4 + streak * 1.3)) * 0.55;

          col = mix(col, vec3(0.78, 0.87, 0.92), clamp(foam, 0.0, 1.0) * 0.62);

          // 雾
          float fogF = 1.0 - exp(-uFogDensity * uFogDensity * dot(vWorld - uCamPos, vWorld - uCamPos));
          col = mix(col, uFogColor, clamp(fogF, 0.0, 1.0));

          float alpha = clamp(mix(0.55, 0.92, depthF) + foam * 0.25, 0.0, 0.95);
          gl_FragColor = vec4(col, alpha);
        }`,
    });

    waterMesh = new THREE.Mesh(g, mat);
    scene.add(waterMesh);
  }
  buildWater();

  /* ================================================================
     九、石：水中卵石 · 石梁 · 岸石
  ================================================================ */
  function makeRockGeometry(seed, amp) {
    const geo = new THREE.IcosahedronGeometry(1, 1);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const k = (hash3(x * 3.1 + seed, y * 3.1 - seed, z * 3.1 + seed * 0.7) - 0.5) * amp;
      p.setXYZ(i, x + k, y + (hash3(y * 7 + x, z * 7, seed) - 0.5) * amp * 0.7, z + k);
    }
    geo.computeVertexNormals();
    return geo;
  }
  const rockGeos = [makeRockGeometry(3.1, 0.26), makeRockGeometry(7.7, 0.2), makeRockGeometry(12.9, 0.3)];
  const rockMats = [
    new THREE.MeshStandardMaterial({ color: 0x46505c, roughness: 0.95, flatShading: true }),
    new THREE.MeshStandardMaterial({ color: 0x3e4854, roughness: 0.95, flatShading: true }),
    new THREE.MeshStandardMaterial({ color: 0x50565e, roughness: 0.9, flatShading: true }),
  ];
  function addRock(x, z, r, opts = {}) {
    const h = opts.y !== undefined ? opts.y : terrainH(x, z) - r * 0.3;
    const m = new THREE.Mesh(rockGeos[(rng() * 3) | 0], rockMats[(rng() * 3) | 0]);
    m.position.set(x, h, z);
    m.scale.set(r, r * (opts.squash || 0.72), r * (0.8 + rng() * 0.4));
    m.rotation.y = rng() * Math.PI * 2;
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
    if (opts.foam) inStreamRocks.push({ x, z, r: r + 0.15 });
    return m;
  }

  // 水中卵石（约一半沉默水下，一半破水而出）
  {
    const placed = [];
    let guard = 0;
    while (placed.length < 11 && guard++ < 500) {
      const z = -52 + rng() * 90;
      const side = rng() < 0.5 ? -1 : 1;
      const x = centerX(z) + side * (0.4 + rng() * 1.6);
      const r = 0.32 + rng() * 0.7;
      if (placed.some(p => Math.hypot(p.x - x, p.z - z) < r + p.r + 1.5)) continue;
      placed.push({ x, z, r });
      addRock(x, z, r, { y: floorH(z) + r * 0.22, foam: true });
    }
    // 石梁：水漫石而过
    const slabs = [2, -18, -38];
    for (const sz of slabs) {
      const x = centerX(sz) + (rng() - 0.5) * 0.8;
      const s = 0.9 + rng() * 0.35;
      addRock(x, sz, 0.95 * s, { y: floorH(sz) + 0.45, squash: 0.3, foam: true });
      inStreamRocks[inStreamRocks.length - 1].r = 0.95 * s;
    }
    // 岸石
    for (let i = 0; i < 12; i++) {
      const z = -60 + rng() * 95;
      const side = rng() < 0.5 ? -1 : 1;
      const x = centerX(z) + side * (5.2 + rng() * 3.5);
      addRock(x, z, 0.5 + rng() * 1.1);
    }
  }
  // 泡沫数据送入着色器（最多 12 块）
  {
    const list = inStreamRocks.slice(0, 12);
    list.forEach((r, i) => {
      waterUniforms.uRocks.value[i].set(r.x, 0, r.z);

  /* ================================================================
     十、松：风骨遒劲的松林
  ================================================================ */
  function paint(geo, hex, lighten) {
    const c = new THREE.Color(hex);
    const p = geo.attributes.position;
    const arr = new Float32Array(p.count * 3);
    for (let i = 0; i < p.count; i++) {
      const v = (hash3(p.getX(i) * 9, p.getY(i) * 9, p.getZ(i) * 9) - 0.5) * 0.08;
      arr[i*3]   = Math.min(1, c.r * (1 + lighten + v));
      arr[i*3+1] = Math.min(1, c.g * (1 + lighten + v));
      arr[i*3+2] = Math.min(1, c.b * (1 + lighten + v));
    }
    geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  }
  function jitterGeo(geo, amp, seed) {
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const k = (hash3(x * 5.3 + seed, y * 5.3, z * 5.3 - seed) - 0.5) * amp;
      p.setXYZ(i, x + k, y + (hash3(y * 9 + x, z * 9, seed) - 0.5) * amp * 0.6, z + k);
    }
  }
  function buildPineGeometry(seed) {
    const parts = [];
    // 躯干
    const trunk = new THREE.CylinderGeometry(0.16, 0.28, 2.4, 8);
    trunk.translate(0, 1.2, 0);
    jitterGeo(trunk, 0.05, seed);
    trunk.computeVertexNormals();
    paint(trunk, 0x2e2418, 0);
    parts.push(trunk);
    // 层层松冠
    const layers = 6;
    for (let i = 0; i < layers; i++) {
      const f = 1 - i / layers;
      const r = 1.85 * Math.pow(f, 0.85) + 0.25;
      const cone = new THREE.ConeGeometry(r, 1.7, 9);
      cone.translate(
        (hash3(seed, i, 1.0) - 0.5) * 0.28,
        1.35 + i * 1.05 + 0.85,
        (hash3(seed, i, 2.0) - 0.5) * 0.28
      );
      jitterGeo(cone, 0.11 + i * 0.015, seed + i * 3.3);
      cone.computeVertexNormals();
      paint(cone, i < 3 ? 0x152a1a : 0x1d3620, i / layers * 0.25);
      parts.push(cone);
    }
    // 顶梢
    const tip = new THREE.ConeGeometry(0.18, 1.1, 7);
    tip.translate(0, 1.35 + layers * 1.05 + 0.6, 0);
    jitterGeo(tip, 0.05, seed + 99);
    tip.computeVertexNormals();
    paint(tip, 0x2b4d2c, 0.15);
    parts.push(tip);
    return mergeGeometries(parts);
  }
  const pineGeos = [buildPineGeometry(1.7), buildPineGeometry(5.3), buildPineGeometry(9.1)];
  const pineMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0 });

  function addPine(x, z, s, v) {
    const m = new THREE.Mesh(pineGeos[v % 3], pineMat);

    m.rotation.y = rng() * Math.PI * 2;
    m.castShadow = true;
    scene.add(m);
    return m;
  }

  {
    const trees = [];

    }
    for (const t of trees) addPine(t.x, t.z, t.s, t.v);

    // 取景松：在月亮视线走廊上立几株，让月光“松间”洒落
    const hero = [
      { x: -6.5, z: 9,   s: 1.55 },
      { x: 9.2,  z: 7,   s: 1.1 },
      { x: -11,  z: 12,  s: 0.95 },
      { x: -3.5, z: 15,  s: 0.85 },
      { x: -10,  z: -14, s: 1.35 },
      { x: -16,  z: -26, s: 1.3 },

  /* ================================================================
     十一、涧上轻雾 · 萤火

  const mists = [];
  {

    for (let i = 0; i < 10; i++) {

  const fireflyUniforms = { uTime: { value: 0 } };
  {
    const N = 64;

    const col = new Float32Array(N * 3);
    const palette = [new THREE.Color(0xd6f5a0), new THREE.Color(0xcdeb8f), new THREE.Color(0xe8f7b0)];
    let i = 0, guard = 0;
    while (i < N && guard++ < 800) {
      const z = -60 + rng() * 92;
      const side = rng() < 0.5 ? -1 : 1;
      const x = centerX(z) + side * (4.5 + rng() * 12);

      if (h < waterY(z) + 0.4) continue;
      pos[i*3] = x; pos[i*3+1] = h + 0.5 + rng() * 1.8; pos[i*3+2] = z;
      phase[i] = rng() * Math.PI * 2;
      speed[i] = 0.5 + rng() * 0.8;
      amp[i] = 0.5 + rng() * 1.1;
      const c = palette[(rng() * 3) | 0];
      col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
      i++;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    g.setAttribute('aSpeed', new THREE.BufferAttribute(speed, 1));
    g.setAttribute('aAmp', new THREE.BufferAttribute(amp, 1));
    g.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: fireflyUniforms,
      vertexShader: /* glsl */`
        attribute float aPhase; attribute float aSpeed; attribute float aAmp; attribute vec3 aColor;
        uniform float uTime;
        varying vec3 vColor; varying float vTw;
        void main() {
          vColor = aColor;
          vec3 p = position;
          p.x += sin(uTime * aSpeed + aPhase) * aAmp;
          p.y += sin(uTime * aSpeed * 0.7 + aPhase * 2.0) * aAmp * 0.5;
          p.z += cos(uTime * aSpeed * 0.9 + aPhase * 1.3) * aAmp;
          vTw = smoothstep(0.15, 0.9, sin(uTime * 1.6 + aPhase * 23.0) * 0.5 + 0.5);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (1.6 + 1.2 * vTw) * (42.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        varying vec3 vColor; varying float vTw;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          float a = smoothstep(0.5, 0.05, d);
          gl_FragColor = vec4(vColor * (0.5 + vTw), a * vTw * 0.9);
        }`,
    });
    const pts = new THREE.Points(g, mat);
    pts.renderOrder = 6;
    scene.add(pts);
  }

  /* ================================================================
     十二、后期与主循环
  ================================================================ */
  const composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.35, 0.75);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
  });

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    const dt = Math.min(clock.getDelta ? 0.016 : 0.016, 0.05);

    waterUniforms.uTime.value = t;
    starMat.uniforms.uTime.value = t;
    fireflyUniforms.uTime.value = t;

    // 轻雾漂游
    for (const m of mists) {
      m.position.z += m.userData.speed * 0.016;
      if (m.position.z > 26) m.position.z = -48;
      m.position.x = centerX(m.position.z) + Math.sin(t * 0.3 + m.userData.phase) * 1.2;
      m.position.y = waterY(m.position.z) + 1.3 + Math.sin(t * 0.5 + m.userData.phase) * 0.25;
    }
    // 光柱微曜
    for (const b of beams) {
      b.material.opacity = 0.05 + 0.035 * (0.5 + 0.5 * Math.sin(t * 0.3 + b.userData.phase));
      b.rotation.y = Math.atan2(camera.position.x - b.position.x, camera.position.z - b.position.z);
    }
    // 月晕呼吸
    halo1.material.opacity = 0.52 + 0.04 * Math.sin(t * 0.5);

    updateShootingStar(t, dt);
    controls.update();
    composer.render();
  });

  // 提示淡出
  setTimeout(() => { hintEl.style.opacity = '0'; }, 11000);

  // 揭幕
  requestAnimationFrame(() => {
    requestAnimationFrame(() => veil.classList.add('hide'));
  });
}
</script>
