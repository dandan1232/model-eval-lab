<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>明月松间照 · 清泉石上流 | three.js</title>
<meta name="description" content="王维《山居秋暝》「明月松间照，清泉石上流」的三维意境：月下松林，石上清泉。three.js 实时渲染，单文件，无外部素材。">
<meta name="theme-color" content="#05080f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2305080f'/%3E%3Ccircle cx='23' cy='22' r='10' fill='%23f3ead3'/%3E%3Cpath d='M4 45c10-6 18 4 28-2s18-2 28 2v6c-10-4-18-8-28-2s-18 4-28-2z' fill='%237fa7d9'/%3E%3C/svg%3E">
<style>
:root {
  --ink: #ece4d2;
  --ink-dim: rgba(236, 228, 210, 0.6);
  --line: rgba(236, 228, 210, 0.24);
  --night: #05080f;
  --seal: #a3312a;
  --kai: "Kaiti SC", "STKaiti", "KaiTi", "FZKai-Z03", "AR PL UKai CN", "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font-family: var(--sans); -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#scene.is-dragging { cursor: grabbing; }

/* ---- 题诗：竖排，自右向左 */
#poem {
  position: fixed; top: max(5.5vh, 26px); right: max(4vw, 18px); z-index: 3;
  writing-mode: vertical-rl; pointer-events: none;
  font-family: var(--kai); color: var(--ink);
  text-shadow: 0 0 16px rgba(3, 6, 12, 0.92), 0 2px 6px rgba(3, 6, 12, 0.8);
}
#poem .verse { margin-left: 0.1em; font-size: clamp(28px, 4.3vw, 62px); line-height: 1.34; letter-spacing: 0.1em; }
#poem .ch { display: inline-block; opacity: 0; }
body.is-ready #poem .ch { animation: ch-in 1.7s cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(var(--i) * 130ms + 600ms); }
@keyframes ch-in {
  from { opacity: 0; transform: translateY(-14px); filter: blur(8px); }
  to { opacity: 1; transform: none; filter: blur(0); }
}
#poem .credit {
  margin: 0.3em 0.7em 0 0; padding-top: 0.3em; font-size: clamp(12px, 1.05vw, 16px);
  line-height: 1.7; letter-spacing: 0.3em; color: var(--ink-dim);
  opacity: 0; transition: opacity 2.2s ease 2.3s;
}
body.is-ready #poem .credit { opacity: 1; }
#poem .credit .title { font-size: 1.4em; color: var(--ink); }
#poem .seal {
  margin-top: 1.2em; width: 2.6em; height: 2.6em; border-radius: 3px; background: var(--seal); color: #f4e6d8;
  font-size: 0.95em; line-height: 1.15; letter-spacing: 0.02em; text-align: center;
  box-shadow: inset 0 0 0 1px rgba(244, 230, 216, 0.5), inset 0 0 5px rgba(70, 10, 8, 0.7), 0 2px 10px rgba(0, 0, 0, 0.35);
}
#poem .seal span { display: block; }

/* ---- 操作条 */
#controls {
  position: fixed; left: max(20px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom));
  z-index: 4; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: calc(100vw - 40px);
}
.group { display: flex; border: 1px solid var(--line); }
.chip {
  appearance: none; border: 0; margin: 0; background: rgba(6, 10, 20, 0.46); color: var(--ink-dim);
  font: 500 13px/1 var(--sans); letter-spacing: 0.22em; padding: 10px 12px 10px 15px; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  transition: color 0.25s ease, background 0.25s ease; touch-action: manipulation;
}
.group .chip + .chip { border-left: 1px solid var(--line); }
.chip.solo { border: 1px solid var(--line); }
.chip:hover, .chip:focus-visible { color: var(--ink); background: rgba(236, 228, 210, 0.1); outline: none; }
.chip.is-active, .chip[aria-pressed="true"] { color: #0b1020; background: var(--ink); }
.chip[aria-pressed]::before {
  content: ""; display: inline-block; width: 5px; height: 5px; margin-right: 8px; border-radius: 50%;
  background: currentColor; opacity: 0.55; vertical-align: 1px;
}
#hint {
  position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); z-index: 3;
  transform: translateX(-50%); margin: 0; pointer-events: none; white-space: nowrap;
  font-size: 12px; letter-spacing: 0.14em; color: var(--ink-dim);
  text-shadow: 0 1px 8px rgba(3, 6, 12, 0.9); transition: opacity 1.2s ease;
}
#hint.is-hidden { opacity: 0; }

/* ---- 载入与出错 */
.overlay { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; text-align: center; }
#loader {
  background: radial-gradient(120% 90% at 50% 42%, #0b1326 0%, #05080f 72%);
  transition: opacity 1.6s ease; padding: 24px;
}
#loader.is-hidden { opacity: 0; pointer-events: none; }
#loader .line { font-family: var(--kai); font-size: clamp(18px, 2.6vw, 30px); letter-spacing: 0.3em; color: var(--ink); }
#loader .line em { font-style: normal; color: var(--ink-dim); }
#loading-status { margin-top: 20px; min-height: 1.5em; font-size: 12px; letter-spacing: 0.32em; color: var(--ink-dim); }
.bar { width: 180px; height: 1px; margin: 14px auto 0; background: rgba(236, 228, 210, 0.14); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width 0.5s ease; }
#error { background: var(--night); padding: 24px; }
#error.is-hidden, .is-gone { display: none; }
#error p { max-width: 30em; margin: 0 auto 20px; font-size: 15px; line-height: 1.8; color: var(--ink-dim); }
#error h1 { margin: 0 0 12px; font: 400 24px/1.3 var(--kai); letter-spacing: 0.2em; }

/* ---- 窄屏与矮屏 */
/* On a phone in portrait the poem keeps the top right, so the hint goes to the top left without the
   keyboard notes; on a short wide screen it tucks into the bottom right, clear of the controls. */
@media (max-width: 640px) {
  #poem { top: max(3.5vh, 16px); right: 14px; }
  #poem .verse { font-size: clamp(26px, 7.8vw, 40px); }
  #poem .credit { display: none; }
  #hint { top: max(3.5vh, 16px); bottom: auto; left: 14px; transform: none; font-size: 11px; letter-spacing: 0.08em; }
  #hint .keys { display: none; }
  #controls { left: max(12px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); gap: 6px; }
  .chip { padding: 10px 8px 10px 11px; font-size: 12px; letter-spacing: 0.08em; }      // tight enough to stay on one row
  .chip[aria-pressed]::before { margin-right: 6px; }
}
@media (max-height: 540px) {
  #poem { top: max(3vh, 12px); }
  #poem .verse { font-size: clamp(20px, 5.4vh, 36px); }
  #poem .credit { font-size: 11px; }
}
@media (max-height: 540px) and (min-width: 641px) {
  #hint { left: auto; right: max(20px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  #poem .ch { opacity: 1; }
  body.is-ready #poem .ch { animation: none; }
  #poem .credit { transition: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="三维场景：明月透过松林照在石上流过的清泉上"></canvas>

<div id="poem">
  <div class="verse" aria-hidden="true"><span class="ch" style="--i:0">明</span><span class="ch" style="--i:1">月</span><span class="ch" style="--i:2">松</span><span class="ch" style="--i:3">间</span><span class="ch" style="--i:4">照</span>，</div>
  <div class="verse" aria-hidden="true"><span class="ch" style="--i:5">清</span><span class="ch" style="--i:6">泉</span><span class="ch" style="--i:7">石</span><span class="ch" style="--i:8">上</span><span class="ch" style="--i:9">流</span>。</div>
  <div class="credit">
    <div class="title">山居秋暝</div>
    <div class="author">唐 · 王维</div>
    <div class="seal" aria-hidden="true"><span>王維</span><span>之印</span></div>
  </div>
</div>

<nav id="controls" aria-label="视角与设置">
  <div class="group" role="group" aria-label="视角">
    <button class="chip is-active" data-view="spring">听泉</button>
    <button class="chip" data-view="moon">望月</button>
    <button class="chip" data-view="pines">松间</button>
  </div>
  <button class="chip solo" id="btn-drift" aria-pressed="true">漫游</button>
  <button class="chip solo" id="btn-sound" aria-pressed="false">泉声</button>
  <button class="chip solo is-gone" id="btn-fullscreen">全屏</button>
</nav>
<p id="hint">拖动环视 · 滚轮远近<span class="keys"> · 1 2 3 切换视角 · 空格暂停漫游 · M 泉声</span></p>

<div id="loader" class="overlay">
  <div>
    <div class="line">明月松间照 <em>·</em> 清泉石上流</div>
    <div id="loading-status">正在研墨</div>
    <div class="bar"><i id="loading-bar"></i></div>
  </div>
</div>
<div id="error" class="overlay is-hidden" role="alert">
  <div>
    <h1>山间起了大雾</h1>
    <p id="error-message"></p>
    <button class="chip solo" id="btn-retry">再试一次</button>
  </div>
</div>
<noscript><style>#loader { display: none; }</style><div class="overlay"><p>这个场景需要启用 JavaScript 才能呈现。</p></div></noscript>

<script type="module">
// =====================================================================================
//  明月松间照 · 清泉石上流 — 王维《山居秋暝》
//  A moonlit pine valley with a stream running over stones, drawn live with WebGL.
//  Single file, no build step. The only dependency is three.js, pulled from a CDN by
//  a loader that falls through several mirrors (section 0). Every texture, mesh and
//  sound is generated at start-up.
//
//    0. boot: three.js loader            6. pines and undergrowth
//    1. helpers and procedural textures  7. atmosphere: mist, motes, leaves
//    2. the valley: stream, bed, stones  8. lighting
//    3. sky: moon, stars, clouds, ridges 9. post: HDR, bloom, moon shafts, grade
//    4. terrain                          10. camera and views
//    5. water                            11. ui, sound, main loop
// =====================================================================================

const $ = (id) => document.getElementById(id);
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));
const fail = (message) => Object.assign(new Error(message), { friendly: true });   // a message meant to be shown as it is

function showError(message) {
  $('loader').classList.add('is-hidden');
  $('error').classList.remove('is-hidden');
  $('error-message').textContent = message;
}
$('btn-retry').addEventListener('click', () => location.reload());

// ---------------------------------------------------------------- 0. boot
// No single CDN is reliable everywhere, so start several in turn: each gets a short
// exclusive window before the next one starts alongside it, and the first to finish wins.
const THREE_VERSION = '0.187.0';
const THREE_SOURCES = [
  `https://registry.npmmirror.com/three/${THREE_VERSION}/files/build/three.module.js`,
  `https://esm.sh/three@${THREE_VERSION}`,
  `https://unpkg.com/three@${THREE_VERSION}/build/three.module.js`,
  `https://cdn.jsdelivr.net/npm/three@${THREE_VERSION}/build/three.module.js`,
];
const SOURCE_WINDOW = 2500;

async function loadThree() {
  const status = $('loading-status');
  const label = `three.js r${THREE_VERSION.split('.')[1]}`;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  let mod = null;
  const racing = new Set();                       // imports that have started and not settled yet
  const attempt = (url) => {
    const promise = import(url).then((m) => { if (!mod) mod = m; }, () => {}).finally(() => racing.delete(promise));
    racing.add(promise);
  };

  for (let i = 0; i < THREE_SOURCES.length && !mod; i++) {
    status.textContent = `正在载入 ${label} · 第 ${i + 1} 处镜像`;
    attempt(THREE_SOURCES[i]);
    // Move on once the sources in flight have settled, or when this one's window ends.
    await Promise.race([racing.size ? Promise.race(racing) : sleep(0), sleep(SOURCE_WINDOW)]);
  }
  if (!mod) {
    status.textContent = `正在载入 ${label} · 还在等较慢的一处镜像`;
    await Promise.race([Promise.all(racing), sleep(20000)]);
  }
  if (!mod) throw fail(`无法从 ${THREE_SOURCES.length} 个镜像加载 ${label}。请检查网络连接后重试。`);
  return mod;
}

async function main() {
const THREE = await loadThree();

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: $('scene'), antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
} catch (err) {
  throw fail('当前浏览器或设备不支持 WebGL 2，无法呈现三维场景。请换用较新的 Chrome、Edge、Firefox 或 Safari。');
}

// ---------------------------------------------------------------- 1. helpers
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');                // exposes window.__moon for tinkering
const STILL = params.has('still');                // freeze the clock, for stable screenshots
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// Smooth maximum: like Math.max, but with a rounded corner of width ~1/k.
const smax = (a, b, k) => { const m = Math.max(a, b); return m + Math.log(1 + Math.exp(-k * Math.abs(a - b))) / k; };

function mulberry32(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Integer lattice hash -> [0, 1). Everything procedural is seeded, so the scene is the same on every visit.
function hash2i(ix, iy, seed) {
  let h = Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(seed, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

// Value noise in [-1, 1], on an infinite lattice or on a torus of `period` cells.
function lattice(x, y, period, seed) {
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  let xa = x0, xb = x0 + 1, ya = y0, yb = y0 + 1;
  if (period) {
    xa = ((xa % period) + period) % period; xb = (xb % period + period) % period;
    ya = ((ya % period) + period) % period; yb = (yb % period + period) % period;
  }
  const a = hash2i(xa, ya, seed), b = hash2i(xb, ya, seed), c = hash2i(xa, yb, seed), d = hash2i(xb, yb, seed);
  return (lerp(lerp(a, b, ux), lerp(c, d, ux), uy)) * 2 - 1;
}
const noise2 = (x, y, seed = 0) => lattice(x, y, 0, seed);

function fbm2(x, y, octaves, seed) {
  let sum = 0, amp = 1, norm = 0;
  for (let i = 0; i < octaves; i++) {
    sum += noise2(x, y, seed + i * 131) * amp;
    norm += amp;
    amp *= 0.5;
    x = x * 2.03 + 31.7;
    y = y * 2.03 + 17.3;
  }
  return sum / norm;
}

// Tileable fbm over the unit square; `period` is the number of cells across the lowest octave.
function pfbm(u, v, octaves, period, seed) {
  let sum = 0, amp = 1, norm = 0, p = period;
  for (let i = 0; i < octaves; i++) {
    sum += lattice(u * p, v * p, p, seed + i * 131) * amp;
    norm += amp;
    amp *= 0.5;
    p *= 2;
  }
  return sum / norm;
}

// ---- textures -------------------------------------------------------------------
// All maps come from typed arrays, so they can carry hand-built mipmaps: for foliage the
// coarser levels keep the alpha of the finest needles instead of averaging them away.
function dataTexture(data, w, h, { srgb = false, repeat = true, mips = null } = {}) {
  const t = new THREE.DataTexture(data, w, h, THREE.RGBAFormat, THREE.UnsignedByteType);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  if (mips) { t.mipmaps = mips; t.generateMipmaps = false; }
  else t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.wrapS = t.wrapT = repeat ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  t.needsUpdate = true;
  return t;
}

function buildMips(data, w, h, keepAlpha = false) {
  const mips = [];
  let cur = data, cw = w, ch = h;
  while (cw > 1 && ch > 1 && mips.length < 10) {
    const nw = Math.max(1, cw >> 1), nh = Math.max(1, ch >> 1), out = new Uint8Array(nw * nh * 4);
    for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++) {
      let r = 0, g = 0, b = 0, a = 0, aMax = 0, wsum = 0;
      for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
        const sx = Math.min(cw - 1, x * 2 + i), sy = Math.min(ch - 1, y * 2 + j), k = (sy * cw + sx) * 4;
        const al = cur[k + 3] / 255;
        r += cur[k] * al; g += cur[k + 1] * al; b += cur[k + 2] * al; wsum += al; a += al; aMax = Math.max(aMax, al);
      }
      const o = (y * nw + x) * 4;
      if (wsum > 0) { out[o] = r / wsum; out[o + 1] = g / wsum; out[o + 2] = b / wsum; }
      out[o + 3] = (keepAlpha ? aMax * 0.75 + (a / 4) * 0.25 : a / 4) * 255;
    }
    mips.push({ data: out, width: nw, height: nh });
    cur = out; cw = nw; ch = nh;
  }
  return mips;
}

const makeCanvas = (w, h = w) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

function texFromCanvas(canvas, { flip = false, repeat = false, keepAlpha = false } = {}) {
  const { width: w, height: h } = canvas;
  const src = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const data = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) data.set(src.subarray((flip ? h - 1 - y : y) * w * 4, (flip ? h - y : y + 1) * w * 4), y * w * 4);
  return dataTexture(data, w, h, { srgb: true, repeat, mips: buildMips(data, w, h, keepAlpha) });
}

// Heights -> tangent-space normal map (x, y in red and green, height in blue).
function heightToNormal(hgt, w, h, strength) {
  const out = new Uint8Array(w * h * 4);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const hx = (hgt[y * w + ((x + 1) % w)] - hgt[y * w + ((x - 1 + w) % w)]) * strength * 0.5;
    const hy = (hgt[((y + 1) % h) * w + x] - hgt[((y - 1 + h) % h) * w + x]) * strength * 0.5;
    const inv = 127 / Math.hypot(hx, hy, 1), o = (y * w + x) * 4;
    out[o] = 128 - hx * inv; out[o + 1] = 128 - hy * inv; out[o + 2] = 128 + inv; out[o + 3] = 255;
  }
  return out;
}

// Tileable cellular field: one feature point per cell, distances in texture units.
function worley(w, h, cellsX, cellsY, seed) {
  const f1 = new Float32Array(w * h).fill(9), f2 = new Float32Array(w * h).fill(9), id = new Uint16Array(w * h);
  const px = new Float32Array(cellsX * cellsY), py = new Float32Array(cellsX * cellsY);
  for (let cy = 0; cy < cellsY; cy++) for (let cx = 0; cx < cellsX; cx++) {
    px[cy * cellsX + cx] = hash2i(cx, cy, seed); py[cy * cellsX + cx] = hash2i(cx, cy, seed + 1);
  }
  for (let y = 0; y < h; y++) {
    const v = (y / h) * cellsY, cy = Math.floor(v);
    for (let x = 0; x < w; x++) {
      const u = (x / w) * cellsX, cx = Math.floor(u), k = y * w + x;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const gx = (cx + i + cellsX) % cellsX, gy = (cy + j + cellsY) % cellsY, g = gy * cellsX + gx;
        const dx = (cx + i + px[g] - u) / cellsX, dy = (cy + j + py[g] - v) / cellsY;
        const d = Math.hypot(dx, dy);
        if (d < f1[k]) { f2[k] = f1[k]; f1[k] = d; id[k] = g; } else if (d < f2[k]) f2[k] = d;
      }
    }
  }
  return { f1, f2, id };
}

function makeWaterNormal(size = 256) {
  const H = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size;
    const warpX = pfbm(u, v, 3, 3, 12) * 0.12, warpY = pfbm(u, v, 3, 3, 13) * 0.12;      // the warp breaks up the lattice
    H[y * size + x] = pfbm(u + warpX, v + warpY, 6, 6, 14) * 0.7 + pfbm(u + 0.37, v + 0.61, 4, 18, 15) * 0.3;
  }
  const sx = new Float32Array(size * size), sy = new Float32Array(size * size), out = new Uint8Array(size * size * 4);
  let rms = 0;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const k = y * size + x;
    sx[k] = (H[y * size + (x + 1) % size] - H[y * size + (x - 1 + size) % size]) * size * 0.5;
    sy[k] = (H[((y + 1) % size) * size + x] - H[((y - 1 + size) % size) * size + x]) * size * 0.5;
    rms += sx[k] * sx[k] + sy[k] * sy[k];
  }
  const norm = 0.55 / Math.sqrt(rms / (size * size));                                     // typical slope of 0.55
  for (let k = 0; k < size * size; k++) {
    const inv = 127 / Math.hypot(sx[k] * norm, sy[k] * norm, 1), o = k * 4;
    out[o] = 128 - sx[k] * norm * inv; out[o + 1] = 128 - sy[k] * norm * inv; out[o + 2] = 128 + inv; out[o + 3] = 255;
  }
  return dataTexture(out, size, size);
}

function makeNoise(size = 256) {
  const out = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size, k = (y * size + x) * 4;
    out[k] = 128 + 127 * pfbm(u, v, 5, 4, 1);
    out[k + 1] = 128 + 127 * pfbm(u, v, 4, 8, 2);
    out[k + 2] = 128 + 127 * pfbm(u, v, 3, 16, 3);
    out[k + 3] = 128 + 127 * pfbm(u, v, 2, 32, 4);
  }
  return dataTexture(out, size, size);
}

const STONE_PALETTE = [[0.5, 0.52, 0.55], [0.36, 0.37, 0.38], [0.6, 0.6, 0.58], [0.42, 0.4, 0.37], [0.33, 0.36, 0.35], [0.5, 0.48, 0.44]];
function stoneColor(id, seed, out) {
  const h = hash2i(id, seed, 5) * 6, i = Math.floor(h) % 6, t = h - Math.floor(h), j = (i + 1) % 6;
  const n = 0.88 + 0.24 * hash2i(id, seed + 9, 5);
  for (let c = 0; c < 3; c++) out[c] = lerp(STONE_PALETTE[i][c], STONE_PALETTE[j][c], t) * n;
  return out;
}

// River-bed gravel: cobbles in patches, finer pebbles between them, dark gaps where they meet.
function makeStoneMaps(size = 512) {
  const A = worley(size, size, 8, 8, 101), B = worley(size, size, 19, 19, 202);
  const alb = new Uint8Array(size * size * 4), hgt = new Float32Array(size * size), cA = [0, 0, 0], cB = [0, 0, 0];
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const k = y * size + x, u = x / size, v = y / size;
    const patch = smoothstep(0.4, 0.6, 0.5 + 0.5 * pfbm(u, v, 3, 3, 11));              // where the cobbles give way to finer gravel
    const domeA = Math.sqrt(Math.max(0, 1 - (A.f1[k] * 8 / 0.86) ** 2));
    const domeB = Math.sqrt(Math.max(0, 1 - (B.f1[k] * 19 / 0.9) ** 2));
    const h = Math.max(domeA * (1 - patch * 0.85), domeB) * (0.85 + 0.3 * (0.5 + 0.5 * pfbm(u, v, 4, 24, 5)));
    hgt[k] = h;
    stoneColor(A.id[k], 301, cA); stoneColor(B.id[k], 302, cB);
    for (let c = 0; c < 3; c++) alb[k * 4 + c] = 255 * clamp(lerp(cB[c], cA[c], domeA * (1 - patch * 0.85) > domeB ? 1 : 0) * (0.68 + 0.32 * h), 0, 1);
    alb[k * 4 + 3] = 255;
  }
  return { albedo: dataTexture(alb, size, size, { srgb: true }), normal: dataTexture(heightToNormal(hgt, size, size, 2.4), size, size) };
}

function makeRockMaps(size = 512) {
  const alb = new Uint8Array(size * size * 4), hgt = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const k = y * size + x, u = x / size, v = y / size;
    const base = pfbm(u, v, 5, 4, 21), fine = pfbm(u, v, 4, 24, 22), speck = hash2i(x, y, 24) - 0.5;
    const crack = smoothstep(0.012, 0, Math.abs(pfbm(u, v + 0.13, 3, 5, 23)));          // a few hairline cracks
    hgt[k] = base * 0.5 + fine * 0.5 - crack * 0.25 + speck * 0.12;
    const l = clamp(0.36 + 0.09 * base + 0.07 * fine - 0.1 * crack + speck * 0.08, 0, 1), o = k * 4;
    alb[o] = 255 * l * 0.95;
  }
  return { albedo: dataTexture(alb, size, size, { srgb: true }), normal: dataTexture(heightToNormal(hgt, size, size, 5), size, size) };
}

function makeBarkMaps(w = 256, h = 512) {
  const W = worley(w, h, 7, 15, 404);
  const alb = new Uint8Array(w * h * 4), hgt = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = y * w + x, u = x / w, v = y / h;
    const plate = smoothstep(0, 0.2, (W.f2[k] - W.f1[k]) * 7);                         // 0 in a crevice, 1 on a plate
    const l = 0.24 + 0.12 * hash2i(W.id[k], 405, 1);
    hgt[k] = plate * 0.8 + 0.2 * (0.5 + 0.5 * pfbm(u, v, 4, 16, 41));
    const o = k * 4;
    const grain = 0.85 + 0.3 * (0.5 + 0.5 * pfbm(u, v, 4, 32, 43));
    alb[o] = 255 * lerp(0.15, l * grain, plate); alb[o + 1] = 255 * lerp(0.125, l * 0.9 * grain, plate); alb[o + 2] = 255 * lerp(0.105, l * 0.8 * grain, plate); alb[o + 3] = 255;
  }
  return { albedo: dataTexture(alb, w, h, { srgb: true }), normal: dataTexture(heightToNormal(hgt, w, h, 6), w, h) };
}

// Forest floor: moss and soil, strewn with fallen pine needles.
function makeFloorMaps(size = 512) {
  const c = makeCanvas(size), g = c.getContext('2d', { willReadFrequently: true }), img = g.createImageData(size, size), hgt = new Float32Array(size * size);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const k = y * size + x, u = x / size, v = y / size;
    const m = pfbm(u, v, 4, 5, 51), d = pfbm(u, v, 3, 13, 52), t = smoothstep(-0.25, 0.3, m), lum = 0.75 + 0.5 * (0.5 + 0.5 * d), o = k * 4;
    hgt[k] = d * 0.6 + m * 0.4;
    img.data[o] = 255 * lerp(0.20, 0.115, t) * lum; img.data[o + 1] = 255 * lerp(0.155, 0.165, t) * lum; img.data[o + 2] = 255 * lerp(0.105, 0.085, t) * lum; img.data[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const rng = mulberry32(53), needles = ['#5a3f22', '#6e4d26', '#7c5a2b', '#43301c', '#3c4a26'];
  g.lineCap = 'round';
  for (let i = 0; i < 2400; i++) {
    const x = rng() * size, y = rng() * size, a = rng() * TAU, len = 9 + rng() * 9, bend = (rng() - 0.5) * 4;
    g.strokeStyle = needles[(rng() * needles.length) | 0]; g.globalAlpha = 0.5 + rng() * 0.45; g.lineWidth = 1 + rng() * 0.6;
    for (const [ox, oy] of [[0, 0], [size, 0], [0, size], [size, size]]) {               // repeat near the edges to keep the tile seamless
      if (ox && x > 24) continue; if (oy && y > 24) continue;
      g.beginPath(); g.moveTo(x + ox, y + oy);
      g.quadraticCurveTo(x + ox + Math.cos(a) * len * 0.5 - Math.sin(a) * bend, y + oy + Math.sin(a) * len * 0.5 + Math.cos(a) * bend, x + ox + Math.cos(a) * len, y + oy + Math.sin(a) * len);
      g.stroke();
    }
  }
  return { albedo: texFromCanvas(c), normal: dataTexture(heightToNormal(hgt, size, size, 3), size, size) };
}

// One pine spray: twigs radiating from the centre, each ending in a round brush of needles, which is
// what the bundles at the end of a pine shoot look like. Drawn large so the needles stay fine up close.
function makeNeedleTexture(size = 1024) {
  const c = makeCanvas(size), g = c.getContext('2d', { willReadFrequently: true }), rng = mulberry32(7), mid = size / 2;
  g.lineCap = 'round';
  const tips = [];
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * TAU + (rng() - 0.5) * 0.7, r = size * (0.15 + rng() * 0.06);
    tips.push([mid + Math.cos(a) * r, mid + Math.sin(a) * r]);
  }
  g.strokeStyle = '#3a2a1c'; g.lineWidth = size * 0.006;
  for (const [x, y] of tips) { g.beginPath(); g.moveTo(mid, mid); g.lineTo(x, y); g.stroke(); }
  const needle = (x, y, a, len) => {
    const bend = (rng() - 0.5) * len * 0.25;
    const ex = x + Math.cos(a) * len, ey = y + Math.sin(a) * len, mx = (x + ex) / 2 - Math.sin(a) * bend, my = (y + ey) / 2 + Math.cos(a) * bend;
    const dead = rng() < 0.06;                                 // a few of last year's needles have turned brown
    g.strokeStyle = `hsl(${dead ? 28 + rng() * 10 : 146 + rng() * 18} ${dead ? 38 : 28 + rng() * 16}% ${dead ? 24 : 17 + rng() * 14}%)`;
    g.lineWidth = size * 0.0024;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(mx, my, ex, ey); g.stroke();
  };
  for (const [x, y] of tips) for (let i = 0; i < 120; i++) needle(x, y, rng() * TAU, size * (0.085 + rng() * 0.07));
  for (let i = 0; i < 70; i++) needle(mid, mid, rng() * TAU, size * (0.05 + rng() * 0.05));
  return texFromCanvas(c, { keepAlpha: true });
}

function makeGrassTexture(size = 256) {
  const c = makeCanvas(size), g = c.getContext('2d', { willReadFrequently: true }), rng = mulberry32(17);
  for (let i = 0; i < 34; i++) {
    const bx = size * (0.5 + (rng() - 0.5) * 0.5), h = size * (0.5 + rng() * 0.48), lean = (rng() - 0.5) * 0.9, w = 3 + rng() * 4;
    const tipX = bx + lean * h, tipY = size - h, cx = bx + lean * h * 0.25, cy = size - h * 0.6;
    const hue = 92 + rng() * 34, light = 15 + rng() * 13;
    const grad = g.createLinearGradient(0, size, 0, tipY);
    grad.addColorStop(0, `hsl(${hue} 34% ${light * 0.55}%)`); grad.addColorStop(1, `hsl(${hue} 36% ${light * 1.5}%)`);
    g.fillStyle = grad;
    g.beginPath(); g.moveTo(bx - w / 2, size);
    g.quadraticCurveTo(cx - w * 0.35, cy, tipX, tipY);
    g.quadraticCurveTo(cx + w * 0.35, cy, bx + w / 2, size);
    g.closePath(); g.fill();
  }
  return texFromCanvas(c, { flip: true, keepAlpha: true });
}

function makeFernTexture(size = 256) {
  const c = makeCanvas(size), g = c.getContext('2d', { willReadFrequently: true }), rng = mulberry32(23), bx = size / 2, by = size;
  g.lineCap = 'round';
  for (let f = 0; f < 7; f++) {
    const a = -Math.PI / 2 + (f / 6 - 0.5) * 2.5 + (rng() - 0.5) * 0.15, len = size * (0.44 + rng() * 0.17);
    const hue = 118 + rng() * 18, sat = 32 + rng() * 10, light = 15 + rng() * 9;
    const ex = bx + Math.cos(a) * len, ey = by + Math.sin(a) * len, curve = (rng() - 0.5) * 0.5;
    const at = (t) => { const q = 2 * (1 - t) * t; return [bx * t * t + (bx + Math.cos(a + curve) * len * 0.5) * q + ex * t * t, by * t * t + (by + Math.sin(a + curve) * len * 0.5) * q + ey * t * t]; };
    g.strokeStyle = `hsl(${hue} ${sat}% ${light * 0.8}%)`; g.lineWidth = 2;
    g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + Math.cos(a + curve) * len * 0.5, by + Math.sin(a + curve) * len * 0.5, ex, ey); g.stroke();
    g.fillStyle = `hsl(${hue} ${sat}% ${light + 6}%)`;
    for (let i = 0; i < 15; i++) {
      const t = 0.14 + 0.84 * i / 15, [px, py] = at(t), pl = len * 0.2 * Math.pow(Math.sin(Math.PI * Math.min(1, t * 1.12)), 0.8);
      for (const side of [-1, 1]) {
        const pa = a + side * 1.0, lx = px + Math.cos(pa) * pl, ly = py + Math.sin(pa) * pl;
        g.beginPath(); g.moveTo(px, py);
        g.quadraticCurveTo((px + lx) / 2 - Math.sin(pa) * pl * 0.3, (py + ly) / 2 + Math.cos(pa) * pl * 0.3, lx, ly);
        g.quadraticCurveTo((px + lx) / 2 + Math.sin(pa) * pl * 0.22, (py + ly) / 2 - Math.cos(pa) * pl * 0.22, px, py);
        g.fill();
      }
    }
  }
  return texFromCanvas(c, { flip: true, keepAlpha: true });
}

function makeLeafTexture(size = 128) {
  const c = makeCanvas(size), g = c.getContext('2d', { willReadFrequently: true });
  const grad = g.createLinearGradient(0, size, size, 0);
  grad.addColorStop(0, '#7a4a18'); grad.addColorStop(1, '#c98a2e');
  g.fillStyle = grad;
  g.beginPath(); g.moveTo(10, size - 10);
  g.bezierCurveTo(size * 0.35, size * 0.05, size * 0.8, size * 0.05, size - 8, 8);
  g.bezierCurveTo(size * 0.95, size * 0.5, size * 0.6, size * 0.9, 10, size - 10);
  g.fill();
  g.strokeStyle = 'rgba(70,38,10,0.75)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(12, size - 12); g.lineTo(size - 12, 12); g.stroke();
  return texFromCanvas(c, { keepAlpha: true });
}

function makeMoonTexture(size = 512) {
  const c = makeCanvas(size), g = c.getContext('2d', { willReadFrequently: true }), r = size / 2, rng = mulberry32(3);
  const disc = g.createRadialGradient(r, r, 0, r, r, r);
  disc.addColorStop(0, '#fff9ec'); disc.addColorStop(0.7, '#fbf1d8'); disc.addColorStop(0.93, '#e6d9bd'); disc.addColorStop(1, 'rgba(226,214,186,0)');
  g.fillStyle = disc; g.beginPath(); g.arc(r, r, r, 0, TAU); g.fill();
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 9; i++) {                                   // maria
    const a = rng() * TAU, d = rng() * r * 0.62, rad = r * (0.12 + rng() * 0.2), x = r + Math.cos(a) * d, y = r + Math.sin(a) * d;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(150,146,150,0.36)'); gr.addColorStop(1, 'rgba(150,146,150,0)');
    g.fillStyle = gr; g.fillRect(0, 0, size, size);
  }
  for (let i = 0; i < 34; i++) {                                  // craters: a shaded bowl with a pale rim
    const a = rng() * TAU, d = rng() * r * 0.8, rad = r * (0.008 + rng() * 0.028), x = r + Math.cos(a) * d, y = r + Math.sin(a) * d;
    g.fillStyle = 'rgba(255,250,235,0.22)'; g.beginPath(); g.arc(x - rad * 0.12, y - rad * 0.12, rad, 0, TAU); g.fill();
    g.fillStyle = 'rgba(120,114,110,0.2)'; g.beginPath(); g.arc(x + rad * 0.16, y + rad * 0.16, rad * 0.82, 0, TAU); g.fill();
  }
  const img = g.getImageData(0, 0, size, size), d = img.data;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const k = (y * size + x) * 4;
    if (!d[k + 3]) continue;
    const n = 0.93 + 0.14 * (0.5 + 0.5 * pfbm(x / size, y / size, 4, 24, 61));
    d[k] *= n; d[k + 1] *= n; d[k + 2] *= n;
  }
  g.putImageData(img, 0, 0);
  return texFromCanvas(c);
}

function makeRadialTexture(size = 128, mist = false) {
  const out = new Uint8Array(size * size * 4), rng = mulberry32(mist ? 71 : 72);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = (x + 0.5) / size, v = (y + 0.5) / size, dx = u - 0.5, dy = v - 0.5, r = Math.hypot(dx, dy) * 2;
    const fall = Math.pow(Math.max(0, 1 - r * r), mist ? 1.5 : 2.2);
    const n = mist ? 0.55 + 0.45 * (0.5 + 0.5 * pfbm(u, v, 3, 4, 73)) : 1;
    const k = (y * size + x) * 4, a = clamp(fall * n, 0, 1);
    out[k] = out[k + 1] = out[k + 2] = 255; out[k + 3] = a * 255;
  }
  return dataTexture(out, size, size, { repeat: false });
}

const glsl = (x) => (Number.isInteger(x) ? x.toFixed(1) : x.toString());   // JS number -> GLSL float literal

// ---------------------------------------------------------------- 2. the valley
// The stream runs from upstream (-z) to downstream (+z). `streamX` is its centre line and `s` the
// lateral offset from it, so the whole valley is laid out in stream coordinates (s, z).
const Z_UP = -104, Z_DOWN = 44;
const MEANDER = [[2.6, 0.062, 0.4], [1.9, 0.031, 2.9], [0.5, 0.19, 1.1]];          // [amplitude, frequency, phase]
const X0 = MEANDER.reduce((sum, [a, , p]) => sum + a * Math.sin(p), 0);              // puts the centre line through x = 0 at z = 0
const streamX = (z) => MEANDER.reduce((sum, [a, f, p]) => sum + a * Math.sin(z * f + p), 0) - X0;
const halfWidth = (z) => 2.3 + 0.6 * Math.sin(z * 0.093 + 1.3) + 0.25 * Math.sin(z * 0.21 + 0.2);
// Shallow, stony stretches [centre z, half length]; the water is deeper in between.
const RIFFLES = [[16, 5], [-6.5, 3.6], [-17.5, 4.2], [-31, 4], [-47, 5], [-64, 4.5], [-82, 5]];
const riffle = (z) => RIFFLES.reduce((m, [c, w]) => Math.max(m, Math.exp(-(((z - c) / w) ** 2))), 0);
const bedDepth = (z) => 0.36 - 0.26 * riffle(z) + 0.02 * Math.sin(z * 0.9);
// The same line in GLSL, so the water can find its own flow direction.
const streamGLSL = `
float streamX(float z) { return ${MEANDER.map(([a, f, p]) => `${glsl(a)} * sin(z * ${glsl(f)} + ${glsl(p)})`).join(' + ')} - ${glsl(X0)}; }
float streamDX(float z) { return ${MEANDER.map(([a, f, p]) => `${glsl(a * f)} * cos(z * ${glsl(f)} + ${glsl(p)})`).join(' + ')}; }
`;

// Stones in the stream are rounded domes in the bed: their top sits at `top` (the water is at 0) and
// their widest point below the deepest bed, so the part above water has steep, boulder-like sides.
const rngStones = mulberry32(21);
const stoneBuckets = new Map();                 // z-bucketed, so a lookup only touches the stones that can reach it
const BUCKET = 2;
function addStone(s, z, a, b, top, rot = rngStones() * Math.PI) {
  const st = { x: streamX(z) + s, z, a, b, top, c: Math.cos(rot), n: Math.sin(rot), seed: (rngStones() * 4096) | 0 };
  const reach = Math.max(a, b) + 0.4;
  for (let i = Math.floor((z - reach) / BUCKET); i <= Math.floor((z + reach) / BUCKET); i++) {
    if (!stoneBuckets.has(i)) stoneBuckets.set(i, []);
    stoneBuckets.get(i).push(st);
  }
}
// The ones in front of the camera are placed by hand: a cluster in the moon's path.
[[0.5, -3.4, 0.62, 0.5, 0.24], [-0.65, -4.3, 0.38, 0.32, 0.13], [1.65, -4.6, 0.44, 0.38, 0.16],
 [-1.9, -2.0, 0.32, 0.28, 0.07], [2.4, -1.2, 0.55, 0.46, 0.22], [-2.6, -6.6, 0.5, 0.42, 0.2],
 [-0.3, 4.0, 0.5, 0.4, 0.05], [1.9, 2.8, 0.3, 0.26, 0.03], [-2.2, 1.2, 0.36, 0.3, 0.04]].forEach(([s, z, a, b, top]) => addStone(s, z, a, b, top));
for (let z = Z_UP + 1; z < Z_DOWN - 1; z += 0.32 + rngStones() * 0.7) {
  const w = halfWidth(z), r = riffle(z);
  if (rngStones() < 0.25 + 0.6 * r) {
    // riffle stones: crowded where the water is shallow, and there about a third break the surface
    const a = 0.16 + rngStones() * (0.22 + 0.3 * r);
    const top = r > 0.5 ? -0.06 + rngStones() * 0.17 : -0.16 + rngStones() * 0.1;
    addStone((rngStones() * 2 - 1) * (w + 0.5), z + (rngStones() - 0.5) * 0.4, a, a * (0.8 + rngStones() * 0.7), top);
  }
  if (rngStones() < 0.1) {
    // a larger boulder at the water's edge
    const a = 0.4 + rngStones() * 0.5;
    addStone((rngStones() < 0.5 ? -1 : 1) * (w - 0.2 - rngStones() * 0.8), z, a, a * (0.85 + rngStones() * 0.4), 0.08 + rngStones() * 0.24);
  }
}

const SIDE = { left: { slope: 0.3, off: 37.2, seed: 3 }, right: { slope: 0.22, off: 91.7, seed: 8 } };
const info = { h: 0, stone: 0 };
function groundInfo(x, z, out) {
  const cx = streamX(z), w = halfWidth(z), d = Math.abs(x - cx);
  let h;
  if (d < w) {
    h = -bedDepth(z) * Math.pow(1 - (d / w) ** 2, 0.8);                                  // the channel
  } else {
    const e = d - w, side = x < cx ? SIDE.left : SIDE.right;
    const big = fbm2(x * 0.028 + side.off, z * 0.028, 4, side.seed);
    h = 0.75 * (1 - Math.exp(-e / 1.1))                                                 // a low gravel bank,
      + side.slope * Math.pow(Math.max(0, e - 1.6), 1.15) * (1 + 0.5 * big)              // then the valley side rising steeply
      + big * 9 * smoothstep(4, 22, e);
  }
  const up = smoothstep(0.5, 2.5, h);
  h += fbm2(x * 1.9, z * 1.9, 3, 5) * (0.02 + 0.03 * up);                                // gravel and hummocks
  h += fbm2(x * 0.42, z * 0.31, 3, 9) * (0.05 + 0.14 * up);

  let dome = -Infinity;
  const list = stoneBuckets.get(Math.floor(z / BUCKET));
  if (list) for (const st of list) {
    const dx = x - st.x, dz = z - st.z;
    const u = (dx * st.c + dz * st.n) / st.a, v = (-dx * st.n + dz * st.c) / st.b;
    let q2 = u * u + v * v;
    if (q2 < 1.35) {
      q2 *= 1 + 0.22 * noise2(x * 2.3 + st.seed, z * 2.3, 31);                            // a lumpy outline
      if (q2 < 1) {
        const R = 0.36 + st.top;
        const y = -0.36 + R * Math.sqrt(1 - q2) + 0.022 * noise2(x * 5.1 + st.seed, z * 5.1, 47) * (1 - q2);
        if (y > dome) dome = y;
      }
    }
  }
  if (dome > -Infinity) {
    out.stone = 1 / (1 + Math.exp(-18 * (dome - h)));
    h = smax(h, dome, 18);
  } else out.stone = 0;
  out.h = h;
}

// A dense grid of bed heights near the water. The terrain reads it, and the water reads the same
// numbers back as a texture, so what the surface knows about the bed is exactly what is drawn.
const S_BED = 5, NX = 101, NZ = 987, DX = 0.1, DZ = 0.15;
const bedH = new Float32Array(NX * NZ), bedStone = new Float32Array(NX * NZ);
await stage('正在叠石', 30, () => {
  for (let j = 0; j < NZ; j++) {
    const z = Z_UP + j * DZ, cx = streamX(z);
    for (let i = 0; i < NX; i++) {
      groundInfo(cx - S_BED + i * DX, z, info);
      bedH[j * NX + i] = info.h; bedStone[j * NX + i] = info.stone;
    }
  }
});
function bedSample(grid, s, z) {
  const fx = clamp((s + S_BED) / DX, 0, NX - 1.001), fz = clamp((z - Z_UP) / DZ, 0, NZ - 1.001);
  const i = fx | 0, j = fz | 0, tx = fx - i, tz = fz - j, k = j * NX + i;
  return lerp(lerp(grid[k], grid[k + 1], tx), lerp(grid[k + NX], grid[k + NX + 1], tx), tz);
}
const bedAt = (s, z) => bedSample(bedH, s, z);
function heightAt(x, z) {
  const s = x - streamX(z);
  if (Math.abs(s) <= S_BED - 0.15 && z > Z_UP + 0.3 && z < Z_DOWN - 0.3) return bedAt(s, z);
  groundInfo(x, z, info);
  return info.h;
}

// ---------------------------------------------------------------- 3. sky
// The moon hangs low over the upstream gap between the pines, a little to the left of the view.
const MOON_AZ = -9 * DEG, MOON_EL = 15 * DEG;
const MOON_RADIUS = 2.3 * DEG;                   // about nine times the real moon: the size it is painted
const moonDir = new THREE.Vector3(Math.sin(MOON_AZ) * Math.cos(MOON_EL), Math.sin(MOON_EL), -Math.cos(MOON_AZ) * Math.cos(MOON_EL));
const moonTan = Math.tan(MOON_RADIUS);

const skyUniforms = {
  uMoonDir: { value: moonDir }, uTime: { value: 0 }, tMoon: { value: tex.moon }, tNoise: { value: tex.noise },
  uZenith: { value: NIGHT.zenith }, uHorizon: { value: NIGHT.horizon }, uMoonColor: { value: NIGHT.moon }, uGlow: { value: new THREE.Color(0.7, 0.8, 1.0) },
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(1800, 64, 32),
  new THREE.ShaderMaterial({
    uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: /* glsl */`
      varying vec3 vDir;
      void main() {
        vDir = (modelMatrix * vec4(position, 1.0)).xyz - cameraPosition;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uMoonDir, uZenith, uHorizon, uMoonColor, uGlow;
      uniform float uTime;
      uniform sampler2D tMoon;
      uniform sampler2D tNoise;
      varying vec3 vDir;
      float hash21(vec2 p) { p = fract(p * vec2(233.34, 851.73)); p += dot(p, p + 23.45); return fract(p.x * p.y); }
      void main() {
        vec3 d = normalize(vDir);
        float h = d.y;
        vec3 col = mix(uHorizon, uZenith, pow(clamp(h, 0.0, 1.0), 0.5));
        col = mix(col * 0.55, col, smoothstep(-0.1, 0.03, h));

        // The moon: a disc projected on the plane tangent to the sky, under three halos of different widths.
        vec3 up = abs(uMoonDir.y) > 0.98 ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 1.0, 0.0);
        vec3 T = normalize(cross(up, uMoonDir)), B = cross(uMoonDir, T);
        float cosA = dot(d, uMoonDir);
        vec2 p = vec2(dot(d, T), dot(d, B)) / max(cosA, 0.02);
        float x = length(p);                                                     // tan of the angle from the moon
        float r = x / ${glsl(moonTan)};
        float edge = 1.5 * fwidth(r);
        float disc = 1.0 - smoothstep(1.0 - edge, 1.0 + edge, r);
        col += uGlow * (0.2 * exp(-x * 5.0) + 0.1 * exp(-x * 1.6) + 0.034 * exp(-x * 0.55));

        // Wisps of high cloud, silvered where they pass near the moon.
        vec2 q = d.xz / (d.y + 0.14);
        float c1 = texture2D(tNoise, q * vec2(0.035, 0.11) + vec2(uTime * 0.0021, 0.0)).b;
        float c2 = texture2D(tNoise, q * vec2(0.09, 0.26) + vec2(uTime * 0.0034, 0.37)).g;
        float cloud = smoothstep(0.52, 0.86, c1 * 0.65 + c2 * 0.45) * smoothstep(0.02, 0.22, h);
        vec3 cloudCol = mix(uHorizon * 0.9, uGlow * 0.6, pow(max(cosA, 0.0), 18.0));
        col = mix(col, cloudCol, cloud * 0.75);
        col = mix(col, texture2D(tMoon, p / (2.0 * ${glsl(moonTan)}) + 0.5).rgb * 5.0, disc);

        // Stars: one per cell of a stereographic grid, a few bright enough to bloom.
        vec2 sp = d.xz / (1.0 + h) * 110.0;
        vec2 cell = floor(sp), f = fract(sp) - 0.5;
        float rnd = hash21(cell);
        vec2 off = vec2(hash21(cell + 7.1), hash21(cell + 3.7)) - 0.5;
        float star = smoothstep(0.13, 0.0, length(f - off * 0.7)) * step(0.74, rnd);
        float twinkle = 0.75 + 0.25 * sin(uTime * (1.0 + rnd * 3.0) + rnd * 40.0);
        float magnitude = pow(max(rnd - 0.74, 0.0) / 0.26, 3.0);
        col += vec3(0.85, 0.9, 1.0) * star * twinkle * smoothstep(0.03, 0.3, h) * (1.0 - cloud)
             * (1.0 - smoothstep(0.3, 0.9, x)) * (0.3 + 4.0 * magnitude);
        gl_FragColor = vec4(col, 1.0);
      }`,
  }),
);
sky.renderOrder = -10;
sky.frustumCulled = false;
scene.add(sky);

// Ridges closing the valley, each a silhouette that dissolves into the mist at its foot.
const ridgeMat = (color) => new THREE.ShaderMaterial({
  uniforms: { uColor: { value: color }, uMist: { value: NIGHT.fog } },
  vertexShader: /* glsl */`
    attribute float aT; varying float vT;
    void main() { vT = aT; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 uColor, uMist; varying float vT;
    void main() { gl_FragColor = vec4(mix(uMist, uColor, smoothstep(0.0, 0.72, vT)), 1.0); }`,
  depthWrite: false, fog: false,
});
await stage('正在远眺', 38, () => {
  const SEG = 480;
  for (const layer of [
    { r: 1500, base: 0.105, amp: 0.085, freq: 2.6, color: new THREE.Color(0x2a3a60), seed: 5 },
    { r: 1150, base: 0.08, amp: 0.06, freq: 3.4, color: new THREE.Color(0x1d2b48), seed: 9 },
    { r: 850, base: 0.055, amp: 0.04, freq: 4.6, color: new THREE.Color(0x131d33), seed: 13 },
  ]) {
    const pos = new Float32Array((SEG + 1) * 6), t = new Float32Array((SEG + 1) * 2), idx = new Uint32Array(SEG * 6);
    for (let i = 0; i <= SEG; i++) {
      const a = (i / SEG) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      const f = 0.65 * (1 - Math.abs(noise2(ca * layer.freq + 40, sa * layer.freq + 40, layer.seed)))
              + 0.35 * (1 - Math.abs(noise2(ca * layer.freq * 2.7 + 13, sa * layer.freq * 2.7 + 13, layer.seed + 1)));
      const rel = Math.atan2(Math.sin(a - MOON_AZ), Math.cos(a - MOON_AZ));           // signed angle to the moon's bearing
      const notch = 1 - 0.45 * Math.exp(-((rel / 0.38) ** 2));                           // lower under the moon
      const top = layer.r * (layer.base + layer.amp * f) * notch;
      pos.set([layer.r * sa, top, -layer.r * ca, layer.r * sa, -layer.r * 0.12, -layer.r * ca], i * 6);
      t[i * 2] = 1; t[i * 2 + 1] = 0;
      if (i < SEG) idx.set([i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2], i * 6);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aT', new THREE.BufferAttribute(t, 1));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    const mesh = new THREE.Mesh(geo, ridgeMat(layer.color));
    mesh.renderOrder = -9;
    mesh.frustumCulled = false;
    scene.add(mesh);
  }
});

// ---------------------------------------------------------------- 4. terrain
// One mesh for bed, banks and valley sides, on a grid that is fine (10–12 cm) along the stream and
// grows to several metres far up the slopes. Each vertex carries what it is made of: gravel,
// stone, wetness and moss, and the shader blends the maps from those.
let terrain;
await stage('正在铺陈山谷', 48, () => {
  const cols = [];
  for (let i = 0; i <= (2 * S_BED) / DX; i++) cols.push(-S_BED + i * DX);
  for (const [a, b, step] of [[S_BED, 12, 0.4], [12, 24, 1.2], [24, 44, 3], [44, 76, 6], [76, 110, 10]]) {
    for (let s = a + step; s <= b + 1e-6; s += step) cols.push(s, -s);
  }
  cols.sort((a, b) => a - b);
  const rows = [Z_UP];
  for (let z = Z_UP, st = 1.2; z < -46 - 1e-6;) { st = Math.max(0.1, st * 0.981); z = Math.min(z + st, -46); rows.push(z); }
  for (let i = 1; i <= 634; i++) rows.push(-46 + i * 0.12);                  // the near field, from 46 m upstream to 30 m down
  for (let z = -46 + 634 * 0.12, st = 0.12; z < Z_DOWN - 1e-6;) { st = Math.min(1.5, st * 1.1); z = Math.min(z + st, Z_DOWN); rows.push(z); }

  const nc = cols.length, nr = rows.length, nv = nc * nr;
  const pos = new Float32Array(nv * 3), uv = new Float32Array(nv * 2), surf = new Float32Array(nv * 4), idx = new Uint32Array((nr - 1) * (nc - 1) * 6);
  let v = 0;
  for (let j = 0; j < nr; j++) {
    const z = rows[j], cx = streamX(z);
    for (let i = 0; i < nc; i++, v++) {
      const s = cols[i], x = cx + s, inBed = Math.abs(s) <= S_BED + 1e-6;
      const h = inBed ? bedAt(s, z) : (groundInfo(x, z, info), info.h);
      const stone = inBed ? bedSample(bedStone, s, z) : info.stone;
      pos[v * 3] = x; pos[v * 3 + 1] = h; pos[v * 3 + 2] = z;
      uv[v * 2] = x; uv[v * 2 + 1] = z;
      surf[v * 4] = clamp(Math.max(stone, smoothstep(0.55, 0.15, h + 0.22 * noise2(x * 0.6, z * 0.6, 77))), 0, 1);   // gravel near the water
      surf[v * 4 + 1] = stone;
      surf[v * 4 + 2] = 0.45 + 0.55 * smoothstep(0.9, 0.05, h);                                                      // wet: it has just rained
    }
  }
  let q = 0;
  for (let j = 0; j < nr - 1; j++) for (let i = 0; i < nc - 1; i++) {
    const a = j * nc + i, b = a + nc;
    idx[q++] = a; idx[q++] = b; idx[q++] = a + 1; idx[q++] = b; idx[q++] = b + 1; idx[q++] = a + 1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setAttribute('aSurf', new THREE.BufferAttribute(surf, 4));
  geo.setAttribute('aHeight', new THREE.Float32BufferAttribute(pos.filter((_, i) => i % 3 === 1), 1));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  geo.computeVertexNormals();
  const nrm = geo.attributes.normal.array;
  for (let k = 0; k < nv; k++) {
    const open = 1 - nrm[k * 3 + 1];
    surf[k * 4 + 1] = clamp(surf[k * 4 + 1] + smoothstep(0.22, 0.5, open), 0, 1);                 // bare rock where it is steep
    surf[k * 4 + 3] = smoothstep(0.35, 1.1, pos[k * 3 + 1]) * (1 - smoothstep(0.15, 0.4, open)) * (1 - surf[k * 4]);
  }
  geo.attributes.aSurf.needsUpdate = true;

  const mat = new THREE.MeshStandardMaterial({ roughness: 1, metalness: 0, normalMap: tex.stone.normal, envMapIntensity: 0.6 });
  mat.onBeforeCompile = (shader) => {
    Object.assign(shader.uniforms, {
      tPebble: { value: tex.stone.albedo }, tFloor: { value: tex.floor.albedo }, tFloorN: { value: tex.floor.normal },
      tRock: { value: tex.rock.albedo }, tRockN: { value: tex.rock.normal }, tNoise: { value: tex.noise },
    });
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `#include <common>
        attribute vec4 aSurf; attribute float aHeight; varying vec4 vSurf; varying float vHeight; varying vec2 vTex; varying vec3 vWNrm;`)
      .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
        vSurf = aSurf; vHeight = aHeight; vTex = uv; vWNrm = normalize(mat3(modelMatrix) * objectNormal);`);
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `#include <common>
        uniform sampler2D tPebble; uniform sampler2D tFloor; uniform sampler2D tFloorN;
        uniform sampler2D tRock; uniform sampler2D tRockN; uniform sampler2D tNoise;
        varying vec4 vSurf; varying float vHeight; varying vec2 vTex; varying vec3 vWNrm;`)
      .replace('#include <map_fragment>', `
        vec2 wp = vTex;                                                            // maps are projected from above, in metres
        float rockW = clamp(vSurf.y + smoothstep(0.22, 0.5, 1.0 - vWNrm.y), 0.0, 1.0);
        vec3 alb = mix(texture2D(tFloor, wp * 0.11).rgb, texture2D(tPebble, wp * 0.8).rgb, vSurf.x);
        alb = mix(alb, texture2D(tRock, wp * 0.8).rgb, rockW);
        alb = mix(alb, alb * vec3(0.78, 1.0, 0.66), vSurf.w * (0.55 + 0.45 * texture2D(tNoise, wp * 0.35).g));
        float patches = texture2D(tNoise, wp * 0.3).a;                                // damp and drier stretches, a few metres across
        diffuseColor.rgb *= alb * (0.7 + 0.6 * texture2D(tNoise, wp * 0.045).r) * (0.8 + 0.4 * patches)
                         * (1.0 - 0.7 * vSurf.z * (1.0 - smoothstep(0.1, 0.7, vHeight)));`)
      .replace('#include <roughnessmap_fragment>', `
        float roughnessFactor = mix(mix(0.95, 0.7, rockW), 0.6, vSurf.z);`)
      .replace('#include <lights_physical_fragment>', rewriteChunk('lights_physical_fragment', 'material.specularF90 = 1.0;', 'material.specularF90 = mix(mix(0.2, 0.34, vSurf.z), 0.08, 1.0 - smoothstep(-0.03, 0.03, vHeight));'))
      // Under water the bed is lit through the surface, by a narrowed cone of moonlight and less sky.
      .replace('#include <opaque_fragment>', `
        outgoingLight *= 1.0 - 0.55 * ( 1.0 - smoothstep( -0.03, 0.03, vHeight ) );
        #include <opaque_fragment>`)
      .replace('#include <normal_fragment_maps>', `
        {
          vec2 nb = texture2D(tPebble, wp * 0.8).xy * 2.0 - 1.0;
          vec2 nr = texture2D(tRockN, wp * 0.8).xy * 2.0 - 1.0;
          vec2 nf = texture2D(tFloorN, wp * 0.11).xy * 2.0 - 1.0;
          vec2 nxy = nb * vSurf.x * 0.45 + nr * rockW + nf * (1.0 - vSurf.x) * (1.0 - rockW) * 0.5;
          normal = normalize(tbn * normalize(vec3(nxy, 1.0)));
        }`);
  };
  terrain = new THREE.Mesh(geo, mat);
  terrain.receiveShadow = true;
  terrain.castShadow = true;                       // the valley sides shade themselves
  scene.add(terrain);
});

// ---------------------------------------------------------------- 5. water
// A flat sheet along the channel. The shader looks the bed up in the height texture, bends a copy of
// the opaque scene through the surface, mirrors the sky and pines from a cubemap, and lays foam
// wherever the water is thin: at every stone, bank and riffle.
const fx = [];                                    // transparent things the opaque passes must not draw
const waterUniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.lights, THREE.UniformsLib.fog, {
  uTime: { value: 0 }, uResolution: { value: new THREE.Vector2(1, 1) },
  tBed: { value: null }, tNormal: { value: tex.water }, tNoise: { value: tex.noise }, tEnv: { value: null }, tRefract: { value: null },
  uBedParam: { value: new THREE.Vector4(1 / (2 * S_BED), 1 / (DZ * (NZ - 1)), S_BED, Z_UP) },
  uMoonDir: { value: moonDir }, uMoonLight: { value: new THREE.Color() }, uAmbient: { value: new THREE.Color() }, uDeep: { value: new THREE.Color(0x0b1626) },
  uEnvLod: { value: 8 },
}]);
const bedData = new Uint16Array(NX * NZ * 2);
for (let k = 0; k < NX * NZ; k++) {
  bedData[k * 2] = THREE.DataUtils.toHalfFloat(bedH[k]);
  bedData[k * 2 + 1] = THREE.DataUtils.toHalfFloat(bedStone[k]);
}
const bedTex = new THREE.DataTexture(bedData, NX, NZ, THREE.RGFormat, THREE.HalfFloatType);
bedTex.minFilter = bedTex.magFilter = THREE.LinearFilter;
bedTex.unpackAlignment = 1;                      // rows of 16-bit values are not a multiple of four bytes long
bedTex.needsUpdate = true;
waterUniforms.tBed.value = bedTex;

let water;
await stage('正在引泉', 56, () => {
  const COLS = 37, rows = [];
  for (let z = Z_UP; z < Z_DOWN; z += 0.3) rows.push(z);
  rows.push(Z_DOWN);
  const pos = new Float32Array(rows.length * COLS * 3), nrm = new Float32Array(rows.length * COLS * 3), idx = new Uint32Array((rows.length - 1) * (COLS - 1) * 6);
  let v = 0;
  for (let j = 0; j < rows.length; j++) {
    const z = rows[j], cx = streamX(z), w = halfWidth(z) + 0.9;                 // the sheet runs on under the banks and is hidden there
    for (let i = 0; i < COLS; i++, v++) {
      pos[v * 3] = cx + ((i / (COLS - 1)) * 2 - 1) * w; pos[v * 3 + 2] = z;
      nrm[v * 3 + 1] = 1;
    }
  }
  let q = 0;
  for (let j = 0; j < rows.length - 1; j++) for (let i = 0; i < COLS - 1; i++) {
    const a = j * COLS + i, b = a + COLS;
    idx[q++] = a; idx[q++] = b; idx[q++] = a + 1; idx[q++] = b; idx[q++] = b + 1; idx[q++] = a + 1;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: waterUniforms, lights: true, fog: true, transparent: true, depthWrite: false,
    vertexShader: /* glsl */`
      #include <common>
      #include <fog_pars_vertex>
      #include <shadowmap_pars_vertex>
      uniform float uTime;
      varying vec3 vWorld;
      void main() {
        vec3 p = position;
        p.y += sin(p.z * 2.1 + uTime * 2.3 + p.x * 1.7) * 0.006 + sin(p.z * 5.3 - uTime * 3.1 + p.x * 4.1) * 0.003;
        vec4 worldPosition = modelMatrix * vec4(p, 1.0);
        vWorld = worldPosition.xyz;
        vec4 mvPosition = viewMatrix * worldPosition;
        vec3 transformedNormal = normalMatrix * normal;
        #include <shadowmap_vertex>
        #include <fog_vertex>
        gl_Position = projectionMatrix * mvPosition;
      }`,
    fragmentShader: /* glsl */`
      #include <common>
      #include <fog_pars_fragment>
      #include <shadowmap_pars_fragment>
      uniform float uTime;
      uniform vec2 uResolution;
      uniform vec4 uBedParam;
      uniform vec3 uMoonDir, uMoonLight, uAmbient, uDeep;
      uniform float uEnvLod;
      uniform sampler2D tBed; uniform sampler2D tNormal; uniform sampler2D tNoise; uniform sampler2D tRefract;
      uniform samplerCube tEnv;
      varying vec3 vWorld;
      ${streamGLSL}
      vec2 bedSample(vec2 wp) {                                     // height of the bed, and how much of a stone it is

// A pine is a leaning trunk, whorls of branches that flatten and droop as they age, and sprays of
// needles along the outer part of every branch. The wood of every tree is one geometry; the sprays

const windUniform = { value: 0 };

// Needles, grass and ferns all share these changes to the standard material: they sway, and their
// normal is whatever the geometry says, on both faces.
function patchFoliage(material, { flex, translucency = 0 }) {
  material.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = skyUniforms.uTime;
    shader.uniforms.uWind = windUniform;
    shader.uniforms.uMoonDir = { value: moonDir };
    shader.uniforms.uMoonLight = waterUniforms.uMoonLight;
    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform float uWind;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 swayAt = vec3( instanceMatrix[ 3 ][ 0 ], instanceMatrix[ 3 ][ 1 ], instanceMatrix[ 3 ][ 2 ] );
          float swayScale = length( vec3( instanceMatrix[ 0 ][ 0 ], instanceMatrix[ 0 ][ 1 ], instanceMatrix[ 0 ][ 2 ] ) );

      .replace('#include <common>', '#include <common>\nuniform vec3 uMoonDir;\nuniform vec3 uMoonLight;')

      shader.fragmentShader = shader.fragmentShader.replace('#include <opaque_fragment>', `
        {

          float lit = 1.0;
          #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0

// A tube along a polyline. The ring frames are carried along by parallel transport so it never twists.
function loftTube(loft, pts, radii, radial, irregular, seed) {
  const n = pts.length, tangents = [];

  nrm.crossVectors(tangents[0], nrm).normalize();

  for (let i = 0; i < n; i++) {

      if (axis.lengthSq() > 1e-12) nrm.applyAxisAngle(axis.normalize(), Math.acos(clamp(prev.dot(cur), -1, 1)));
      nrm.addScaledVector(cur, -nrm.dot(cur)).normalize();
      along += pts[i].distanceTo(pts[i - 1]);
    }
    const bin = new THREE.Vector3().crossVectors(tangents[i], nrm);
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      const r = radii[i] * (1 + irregular * noise2(ca * 1.7 + seed, sa * 1.7 + i * 0.7, 91));       // same at j = 0 and j = radial
      const nx = nrm.x * ca + bin.x * sa, ny = nrm.y * ca + bin.y * sa, nz = nrm.z * ca + bin.z * sa;
      loft.pos.push(pts[i].x + nx * r, pts[i].y + ny * r, pts[i].z + nz * r);
      loft.nrm.push(nx, ny, nz);
      loft.uv.push((j / radial) * Math.max(1, (radii[0] * TAU) / 0.6), along / 0.6);
    }
    if (i < n - 1) for (let j = 0; j < radial; j++) {
      const a = loft.base + i * (radial + 1) + j, b = a + radial + 1;
      loft.idx.push(a, a + 1, b, b, a + 1, b + 1);
