  forest = new THREE.Group();
  const bark = new THREE.MeshStandardMaterial({ map: tex.bark.albedo, normalMap: tex.bark.normal, roughness: 0.92 });
  for (const [loft, list, far] of [[woodNear, spraysNear, false], [woodFar, spraysFar, true]]) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(loft.pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(loft.nrm, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(loft.uv, 2));
    geo.setIndex(new THREE.BufferAttribute(new Uint32Array(loft.idx), 1));
    const trunks = new THREE.Mesh(geo, bark);
    trunks.castShadow = true;
    trunks.receiveShadow = true;
    trunks.frustumCulled = false;
    forest.add(trunks);

    // Each spray is eight unit cards at random orientations, so that from any side some show face on.
    const needleMat = new THREE.MeshStandardMaterial({ map: tex.needle, alphaTest: 0.38, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.8 });
    patchFoliage(needleMat, { flex: 'length( position ) * 0.5', translucency: 0.35 });
    const mesh = new THREE.InstancedMesh(sprayGeometry(5), needleMat, list.length);
    list.forEach((t, i) => {
      euler.set(t.tilt, t.yaw, t.tilt * 0.7); quat.setFromEuler(euler);
      point.set(t.x, t.y, t.z); scale.set(t.size, t.size * t.flat, t.size * 0.86);
      mesh.setMatrixAt(i, mat4.compose(point, quat, scale));
      mesh.setColorAt(i, tint.setRGB(t.r, t.g, t.b));
    });
    mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    if (far) mesh.name = 'far';                       // the refraction pass leaves these out
    forest.add(mesh);
    if (!far) sprays = mesh;
  }
  scene.add(forest);

  // Undergrowth along the banks: grass on the gravel, ferns a little further up under the trees.
  const under = mulberry32(91);
  const scatterCards = (texture, count, zFrom, zTo, gap, spread, sizeMin, sizeMax, flex, shade) => {
    const mesh = new THREE.InstancedMesh(fanGeometry(), new THREE.MeshStandardMaterial({ map: texture, alphaTest: 0.4, alphaToCoverage: true, side: THREE.DoubleSide, roughness: 0.85 }), count);
    patchFoliage(mesh.material, { flex });
    for (let i = 0; i < count; i++) {
      const z = zFrom + under() * (zTo - zFrom), side = under() < 0.5 ? -1 : 1;
      const s = side * (halfWidth(z) + gap + under() * under() * spread);
      point.set(streamX(z) + s, heightAt(streamX(z) + s, z) - 0.03, z);
      const size = sizeMin + under() * (sizeMax - sizeMin);
      euler.set((under() - 0.5) * 0.25, under() * TAU, (under() - 0.5) * 0.25); quat.setFromEuler(euler);
      scale.set(size * (0.8 + under() * 0.5), size, size * (0.8 + under() * 0.5));
      mesh.setMatrixAt(i, mat4.compose(point, quat, scale));
      mesh.setColorAt(i, tint.setScalar(shade * (0.8 + under() * 0.4)));
    }
    mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
  };
  scatterCards(tex.grass, 900, -34, 16, 0.8, 7, 0.3, 0.75, 'position.y * position.y', 1);
  scatterCards(tex.fern, 220, -40, 18, 2.2, 9, 0.55, 1.15, 'position.y * position.y', 1.15);

  // Boulders on the banks: a lumpy, flattened sphere with normals taken from its own radius function.
  const R = (x, y, z) => {
    const l = Math.hypot(x, y, z) || 1; x /= l; y /= l; z /= l;
    return 1 + 0.26 * noise2(x * 1.6 + 3, z * 1.6 + y * 0.9, 55) + 0.1 * noise2(x * 4.2, y * 4.2 + z * 4.2 + 3, 56);
  };
  const g = (x, y, z) => Math.hypot(x, y, z) - R(x, y, z);
  const ico = new THREE.IcosahedronGeometry(1, 2), ip = ico.attributes.position, bp = [], bn = [], bu = [], eps = 0.01;
  for (let i = 0; i < ip.count; i++) {
    const x = ip.getX(i), y = ip.getY(i), z = ip.getZ(i), r = R(x, y, z);
    bp.push(x * r, y * r * 0.72, z * r);
    const nx = g(x + eps, y, z) - g(x - eps, y, z), ny = (g(x, y + eps, z) - g(x, y - eps, z)) / 0.72, nz = g(x, y, z + eps) - g(x, y, z - eps);
    const l = Math.hypot(nx, ny, nz); bn.push(nx / l, ny / l, nz / l);
    bu.push(ico.attributes.uv.getX(i), ico.attributes.uv.getY(i));
  }
  const boulderGeo = new THREE.BufferGeometry();
  boulderGeo.setAttribute('position', new THREE.Float32BufferAttribute(bp, 3));
  boulderGeo.setAttribute('normal', new THREE.Float32BufferAttribute(bn, 3));
  boulderGeo.setAttribute('uv', new THREE.Float32BufferAttribute(bu, 2));
  if (ico.index) boulderGeo.setIndex(ico.index);
  const boulders = new THREE.InstancedMesh(boulderGeo, new THREE.MeshStandardMaterial({ map: tex.rock.albedo, normalMap: tex.rock.normal, roughness: 0.5 }), 90);
  for (let i = 0; i < 90; i++) {
    const z = -44 + under() * 66, side = under() < 0.5 ? -1 : 1, s = side * (halfWidth(z) + 0.6 + under() * 3.2), x = streamX(z) + s;
    const size = 0.22 + under() * under() * 1.0, y = heightAt(x, z) - size * 0.28;
    euler.set(under() * TAU, under() * TAU, under() * TAU); quat.setFromEuler(euler);
    point.set(x, y, z); scale.setScalar(size);
    boulders.setMatrixAt(i, mat4.compose(point, quat, scale));
    boulders.setColorAt(i, tint.setScalar(lerp(1, 0.5, smoothstep(1.0, 0.1, y))));      // wet ones near the water are darker
  }
  boulders.instanceColor.needsUpdate = true;
  boulders.castShadow = true;
  boulders.receiveShadow = true;
  boulders.frustumCulled = false;
  scene.add(boulders);
});

// ---------------------------------------------------------------- 7. atmosphere
// Mist lying on the water: soft upright cards that drift slowly downstream and wrap. Each one is
// brighter where the line of sight through it points at the moon.
await stage('正在起雾', 76, () => {
  const COUNT = 34, rng = mulberry32(131);
  const geo = new THREE.InstancedBufferGeometry().copy(new THREE.PlaneGeometry(1, 1));
  const seed = new Float32Array(COUNT * 4);
  for (let i = 0; i < COUNT; i++) {
    const z = Z_UP + rng() * (Z_DOWN - Z_UP);
    seed.set([(rng() * 2 - 1) * (halfWidth(z) + 3), z, 10 + rng() * 16, 1.6 + rng() * 2.6], i * 4);
  }
  geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seed, 4));
  geo.instanceCount = COUNT;
  const uniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog, {
    tMist: { value: tex.mist }, uColor: { value: NIGHT.fog.clone().multiplyScalar(1.3) }, uMoonDir: { value: moonDir },
    uMoonColor: { value: NIGHT.moon }, uOpacity: { value: 0.035 },
  }]);
  uniforms.uTime = skyUniforms.uTime;
  const mist = new THREE.Mesh(geo, new THREE.ShaderMaterial({
    uniforms, transparent: true, depthWrite: false, fog: true,
    vertexShader: /* glsl */`
      #include <common>
      #include <fog_pars_vertex>
      attribute vec4 aSeed;                                       // lateral offset, place along the stream, width, height
      uniform float uTime;
      ${streamGLSL}
      varying vec2 vUv;
      varying float vFade;
      varying vec3 vWorld;
      void main() {
        float z = ${glsl(Z_UP)} + mod( aSeed.y - ${glsl(Z_UP)} + uTime * ( 0.14 + 0.1 * fract( aSeed.x * 7.31 ) ), ${glsl(Z_DOWN - Z_UP)} );
        float s = aSeed.x + sin( uTime * 0.05 + aSeed.y * 0.7 ) * 1.5;
        vec3 right = vec3( viewMatrix[ 0 ][ 0 ], viewMatrix[ 1 ][ 0 ], viewMatrix[ 2 ][ 0 ] );
        vec3 world = vec3( streamX( z ) + s, aSeed.w * 0.32, z ) + right * position.x * aSeed.z + vec3( 0.0, 1.0, 0.0 ) * position.y * aSeed.w;
        vUv = uv;
        vWorld = world;
        vec4 mvPosition = viewMatrix * vec4( world, 1.0 );
        vFade = smoothstep( 2.5, 11.0, - mvPosition.z );           // fade out before the camera can pass through one
        #include <fog_vertex>
        gl_Position = projectionMatrix * mvPosition;
      }`,
    fragmentShader: /* glsl */`
      #include <common>
      #include <fog_pars_fragment>
      uniform sampler2D tMist;
      uniform vec3 uColor;
      uniform vec3 uMoonDir;
      uniform vec3 uMoonColor;
      uniform float uOpacity;
      varying vec2 vUv;
      varying float vFade;
      varying vec3 vWorld;
      void main() {
        float toward = pow( max( dot( normalize( vWorld - cameraPosition ), uMoonDir ), 0.0 ), 6.0 );
        gl_FragColor = vec4( uColor * ( 1.0 + 2.0 * toward ) + uMoonColor * toward * 0.25, texture2D( tMist, vUv ).a * uOpacity * vFade );
        #include <fog_fragment>
      }`,
  }));
  mist.frustumCulled = false;
  mist.renderOrder = 3;
  fx.push(mist);
  scene.add(mist);
});

// Motes in the moonlight: a few slow, softly pulsing points among the pines, mostly silver, a few amber.
let motes;
{
  const COUNT = 120, rng = mulberry32(141);
  const pos = new Float32Array(COUNT * 3), seed = new Float32Array(COUNT * 4);
  for (let i = 0; i < COUNT; i++) {
    const z = -46 + rng() * 62, side = rng() < 0.5 ? -1 : 1;
    pos.set([streamX(z) + side * (halfWidth(z) + 1.2 + rng() * 11), 0.3 + rng() * 3.4, z], i * 3);
    seed.set([rng() * 40, 0.12 + rng() * 0.2, 2.2 + rng() * 3.2, rng() < 0.35 ? 1 : 0], i * 4);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
  motes = new THREE.Points(geo, new THREE.ShaderMaterial({
    uniforms: { uTime: skyUniforms.uTime, uScale: { value: 14 }, uSilver: { value: new THREE.Color(0.72, 0.82, 1.0) }, uAmber: { value: new THREE.Color(1.0, 0.72, 0.36) } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute vec4 aSeed;                                       // phase, speed, size, warmth
      uniform float uTime;
      uniform float uScale;
      varying float vGlow;
      varying float vWarm;
      void main() {
        float t = uTime * aSeed.y, ph = aSeed.x;
        vec3 p = position + vec3( sin( t + ph ) * 0.7, sin( t * 0.7 + ph * 2.0 ) * 0.4, cos( t * 0.8 + ph * 3.0 ) * 0.7 );
        vec4 mv = modelViewMatrix * vec4( p, 1.0 );
        gl_PointSize = min( aSeed.z * uScale / - mv.z, 22.0 );
        vGlow = ( 0.25 + 0.75 * pow( 0.5 + 0.5 * sin( uTime * ( 0.35 + aSeed.y ) + ph * 5.0 ), 3.0 ) ) * ( 1.0 - smoothstep( 38.0, 60.0, - mv.z ) );
        vWarm = aSeed.w;
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: /* glsl */`
      uniform vec3 uSilver;
      uniform vec3 uAmber;
      varying float vGlow;
      varying float vWarm;
      void main() {
        float d = length( gl_PointCoord - 0.5 ) * 2.0;
        gl_FragColor = vec4( mix( uSilver, uAmber, vWarm ) * 1.6, exp( - d * d * 6.0 ) * ( 1.0 - smoothstep( 0.7, 1.0, d ) ) * vGlow );
      }`,
  }));
  motes.frustumCulled = false;
  motes.renderOrder = 4;
  fx.push(motes);
  scene.add(motes);
}

// Leaves carried down on the current: small warm flecks that show which way the water runs.
const LEAVES = 18, leafData = [];
const leaves = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.2, 0.1),
  new THREE.MeshStandardMaterial({ map: tex.leaf, alphaTest: 0.5, side: THREE.DoubleSide, roughness: 0.55 }), LEAVES);
leaves.frustumCulled = false;
leaves.renderOrder = 2;
fx.push(leaves);
scene.add(leaves);
{
  const rng = mulberry32(151);
  for (let i = 0; i < LEAVES; i++) leafData.push({ s: (rng() * 2 - 1) * 0.7, z0: rng() * 74, speed: 0.45 + rng() * 0.35, spin: (rng() - 0.5) * 0.8, phase: rng() * TAU, size: 0.7 + rng() * 0.6 });
}
function updateLeaves(t) {
  for (let i = 0; i < LEAVES; i++) {
    const d = leafData[i], z = -52 + ((d.z0 + t * d.speed) % 74);                    // from 52 m upstream to 22 m down
    const s = d.s * halfWidth(z) + Math.sin(t * 0.7 + d.phase) * 0.15;
    euler.set(0.12 * Math.sin(t * 1.3 + d.phase), d.phase + t * d.spin, 0.1 * Math.cos(t * 1.1 + d.phase)); quat.setFromEuler(euler);
    point.set(streamX(z) + s, 0.012 + 0.005 * Math.sin(t * 2.1 + d.phase), z);
    scale.setScalar(bedAt(s, z) < -0.035 ? d.size : 0);                               // a leaf grounding on a stone disappears
    leaves.setMatrixAt(i, mat4.compose(point, quat, scale));
  }
  leaves.instanceMatrix.needsUpdate = true;
}

// ---------------------------------------------------------------- 8. lighting
// One moonlight with shadows, a faint sky bounce, and a cubemap of the scene itself for everything
// wet or glossy to reflect. The fog is the colour of the mist at the foot of the ridges.
const moonLight = new THREE.DirectionalLight(NIGHT.moonLight, 3.0);
moonLight.target.position.set(0, 0, -22);
moonLight.position.copy(moonLight.target.position).addScaledVector(moonDir, 240);
moonLight.castShadow = true;
const small = Math.min(screen.width, screen.height) < 700 || renderer.capabilities.maxTextureSize < 8192;
Object.assign(moonLight.shadow.camera, { left: -62, right: 62, top: 96, bottom: -96, near: 60, far: 420 });
moonLight.shadow.camera.updateProjectionMatrix();
moonLight.shadow.mapSize.set(small ? 2048 : 4096, small ? 2048 : 4096);
moonLight.shadow.bias = -0.0004;
moonLight.shadow.normalBias = 0.06;
moonLight.shadow.radius = 2.5;
const bounce = new THREE.HemisphereLight(NIGHT.skyBounce, NIGHT.groundBounce, 1.5);
scene.add(moonLight, moonLight.target, bounce);
scene.fog = new THREE.FogExp2(NIGHT.fog, 0.007);
waterUniforms.uMoonLight.value.copy(NIGHT.moonLight).multiplyScalar(moonLight.intensity);
waterUniforms.uAmbient.value.copy(NIGHT.skyBounce).multiplyScalar(bounce.intensity * 0.4);

// ---------------------------------------------------------------- 9. post-processing
// Written by hand from render targets and full-screen passes, so the scene needs three.js core only.
// Each frame: an opaque pass at half resolution for the water to refract; the main pass into a
// multisampled HDR target whose depth is resolved to a texture; a bright pass and three sizes of
// bloom; the moon shafts; then one composite pass that tone-maps and grades to the screen.
const envRT = await stage('正在映月', 82, () => {
  // The sky and the pines, caught once in a cubemap: it lights whatever is wet, and the water mirrors it.
  fx.forEach((o) => { o.visible = false; });
  const pmrem = new THREE.PMREMGenerator(renderer);
  const env = pmrem.fromScene(scene, 0, 0.8, 2600, { size: 256, position: new THREE.Vector3(0.8, 0.8, -2) });
  pmrem.dispose();
  fx.forEach((o) => { o.visible = true; });
  return env;
});
scene.environment = envRT.texture;
scene.environmentIntensity = 1.0;
waterUniforms.tEnv.value = envRT.texture;
waterUniforms.uEnvLod.value = Math.log2(envRT.width);

const HDR = THREE.HalfFloatType;
const passCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const passScene = new THREE.Scene();
const passMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), null);
passMesh.frustumCulled = false;
passScene.add(passMesh);
const runPass = (material, target) => { passMesh.material = material; renderer.setRenderTarget(target); renderer.render(passScene, passCamera); };
const passMaterial = (uniforms, fragmentShader) => new THREE.ShaderMaterial({
  uniforms, vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4( position.xy, 0.0, 1.0 ); }`,
  fragmentShader, depthTest: false, depthWrite: false, toneMapped: false,
});

const brightMat = passMaterial({ tSrc: { value: null }, uThreshold: { value: 0.7 }, uKnee: { value: 0.35 } }, /* glsl */`
  uniform sampler2D tSrc;
  uniform float uThreshold;
  uniform float uKnee;
  varying vec2 vUv;
  void main() {
    vec3 c = texture2D( tSrc, vUv ).rgb;
    float l = max( c.r, max( c.g, c.b ) );
    float soft = clamp( l - uThreshold + uKnee, 0.0, 2.0 * uKnee );             // a soft knee, so the glow fades in
    soft = soft * soft / ( 4.0 * uKnee + 1e-4 );
    gl_FragColor = vec4( c * max( soft, l - uThreshold ) / max( l, 1e-4 ), 1.0 );
  }`);

const blurMat = passMaterial({ tSrc: { value: null }, uDir: { value: new THREE.Vector2() } }, /* glsl */`
  uniform sampler2D tSrc;
  uniform vec2 uDir;
  varying vec2 vUv;
  void main() {
    vec3 c = texture2D( tSrc, vUv ).rgb * 0.2270270270;
    c += ( texture2D( tSrc, vUv + uDir * 1.3846153846 ).rgb + texture2D( tSrc, vUv - uDir * 1.3846153846 ).rgb ) * 0.3162162162;
    c += ( texture2D( tSrc, vUv + uDir * 3.2307692308 ).rgb + texture2D( tSrc, vUv - uDir * 3.2307692308 ).rgb ) * 0.0702702703;
    gl_FragColor = vec4( c, 1.0 );
  }`);

// Moon shafts: march from each pixel towards the moon's place on screen and gather the bright sky
// that is still visible along the way. Pines only occlude, so what comes out is light streaming
// between them. Only the sky counts as a source, which is what the depth texture is for.
const SHAFT_SAMPLES = 56;
const shaftMat = passMaterial({
  tSrc: { value: null }, tDepth: { value: null }, uLight: { value: new THREE.Vector2(0.5, 0.5) },
  uAspect: { value: 1.6 }, uDensity: { value: 0.74 }, uDecay: { value: 0.956 }, uWeight: { value: 0.04 },
}, /* glsl */`
  #define SAMPLES ${SHAFT_SAMPLES}
  uniform sampler2D tSrc;
  uniform sampler2D tDepth;
  uniform vec2 uLight;
  uniform float uAspect;
  uniform float uDensity;
  uniform float uDecay;
  uniform float uWeight;
  varying vec2 vUv;
  void main() {
    vec2 aspect = vec2( uAspect, 1.0 );
    vec2 toLight = ( uLight - vUv ) * aspect;
    vec2 stride = normalize( toLight ) * ( length( toLight ) * uDensity / float( SAMPLES ) ) / aspect;
    float below = smoothstep( 0.0, 0.22, toLight.y / max( length( toLight ), 1e-4 ) );   // none beside or above the moon
    vec2 uv = vUv;
    float decay = 1.0;
    vec3 sum = vec3( 0.0 );
    for ( int i = 0; i < SAMPLES; i ++ ) {
      uv += stride;
      if ( uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0 ) break;
      sum += texture2D( tSrc, uv ).rgb * step( 0.9999, texture2D( tDepth, uv ).x ) * decay;
      decay *= uDecay;
    }
    gl_FragColor = vec4( sum * uWeight * below, 1.0 );
  }`);

const compositeMat = passMaterial({
  tScene: { value: null }, tBloom0: { value: null }, tBloom1: { value: null }, tBloom2: { value: null }, tShaft: { value: null }, tDepth: { value: null },
  uInvViewProj: { value: new THREE.Matrix4() }, uCamPos: { value: new THREE.Vector3() }, uFog: { value: NIGHT.fog }, uShaftTint: { value: new THREE.Color(0.72, 0.82, 1.0) },
  uExposure: { value: 1.4 }, uBloom: { value: 0.22 }, uShaft: { value: 0.0 }, uMist: { value: 0.35 }, uGrain: { value: 0.016 },
  uTime: skyUniforms.uTime, uResolution: { value: new THREE.Vector2(1, 1) },
}, /* glsl */`
  uniform sampler2D tScene;
  uniform sampler2D tBloom0;
  uniform sampler2D tBloom1;
  uniform sampler2D tBloom2;
  uniform sampler2D tShaft;
  uniform sampler2D tDepth;
  uniform mat4 uInvViewProj;
  uniform vec3 uCamPos;
  uniform vec3 uFog;
  uniform vec3 uShaftTint;
  uniform float uExposure;
  uniform float uBloom;
  uniform float uShaft;
  uniform float uMist;
  uniform float uGrain;
  uniform float uTime;
  uniform vec2 uResolution;
  varying vec2 vUv;
  const mat3 ACES_IN = mat3( 0.59719, 0.07600, 0.02840, 0.35458, 0.90834, 0.13383, 0.04823, 0.01566, 0.83777 );
  const mat3 ACES_OUT = mat3( 1.60475, -0.10208, -0.00327, -0.53108, 1.10813, -0.07276, -0.07367, -0.00605, 1.07602 );
  vec3 rrtOdt( vec3 v ) { vec3 a = v * ( v + 0.0245786 ) - 0.000090537; vec3 b = v * ( 0.983729 * v + 0.4329510 ) + 0.238081; return a / b; }
  vec3 aces( vec3 c ) { return clamp( ACES_OUT * rrtOdt( ACES_IN * ( c / 0.6 ) ), 0.0, 1.0 ); }
  float hash( vec2 p ) { return fract( sin( dot( p, vec2( 12.9898, 78.233 ) ) ) * 43758.5453 ); }
  void main() {
    vec3 c = texture2D( tScene, vUv ).rgb;
    c += ( texture2D( tBloom0, vUv ).rgb * 0.5 + texture2D( tBloom1, vUv ).rgb * 0.4 + texture2D( tBloom2, vUv ).rgb * 0.35 ) * uBloom;
    c += texture2D( tShaft, vUv ).rgb * uShaftTint * uShaft;

    float d = texture2D( tDepth, vUv ).x;
    if ( d < 1.0 ) {                                           // ground mist: denser the farther away and the closer to the water
      vec4 w = uInvViewProj * vec4( vUv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0 );
      float mist = 1.0 - exp( - length( w.xyz / w.w - uCamPos ) * 0.009 * exp( - max( w.y / w.w, 0.0 ) * 1.2 ) );
      c = mix( c, uFog * 1.25, clamp( mist, 0.0, 0.92 ) * uMist );
    }

    c = aces( c * uExposure );
    float l = dot( c, vec3( 0.2126, 0.7152, 0.0722 ) );
    c = mix( c, c * vec3( 0.93, 0.98, 1.08 ), ( 1.0 - l ) * 0.55 );              // cool the shadows
    c = mix( c, c * vec3( 1.05, 1.0, 0.94 ), smoothstep( 0.45, 1.0, l ) * 0.45 ); // warm the highlights
    c = mix( vec3( l ), c, 1.1 );
    c *= 1.0 - 0.45 * smoothstep( 0.25, 0.85, length( vUv - 0.5 ) );             // vignette, which also settles the corners for the text
    c = pow( c, vec3( 1.0 / 2.2 ) );
    c += ( hash( vUv * uResolution + fract( uTime ) * 61.0 ) - 0.5 ) * uGrain;
    gl_FragColor = vec4( c, 1.0 );
  }`);

let rtScene = null, rtRefract = null, rtBright = null, rtShaft = null, rtBlur = [];
let viewW = 1, viewH = 1, renderScale = 1;
function allocateTargets() {
  [rtScene, rtRefract, rtBright, rtShaft, ...rtBlur].forEach((t) => t && t.dispose());
  rtScene = new THREE.WebGLRenderTarget(viewW, viewH, { type: HDR, depthTexture: new THREE.DepthTexture(viewW, viewH) });
  rtScene.resolveDepthBuffer = true;                            // the shafts need the depth of the resolved image
  rtRefract = new THREE.WebGLRenderTarget(Math.max(1, viewW >> 1), Math.max(1, viewH >> 1), { type: HDR });
  waterUniforms.tRefract.value = rtRefract.texture;
  rtBright = new THREE.WebGLRenderTarget(Math.max(1, viewW >> 1), Math.max(1, viewH >> 1), { type: HDR, depthBuffer: false });
  rtShaft = new THREE.WebGLRenderTarget(Math.max(1, viewW >> 2), Math.max(1, viewH >> 2), { type: HDR, depthBuffer: false });
  rtBlur = [1, 2, 3].map((level) => [0, 1].map(() => new THREE.WebGLRenderTarget(Math.max(1, viewW >> (level + 1)), Math.max(1, viewH >> (level + 1)), { type: HDR, depthBuffer: false })));
}

const viewProjection = new THREE.Matrix4();
const moonPoint = new THREE.Vector3();
const passInfo = { refract: null, main: null };
function render() {
  fx.forEach((o) => { o.visible = false; });
  forest.children.forEach((o) => { if (o.name === 'far') o.visible = false; });
  renderer.setRenderTarget(rtRefract);                         // 1. everything solid near the water, for the water to look through
  renderer.render(scene, camera);
  forest.children.forEach((o) => { o.visible = true; });
  passInfo.refract = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  fx.forEach((o) => { o.visible = true; });
  renderer.setRenderTarget(rtScene);                           // 2. the whole scene, in HDR
  renderer.render(scene, camera);
  passInfo.main = { calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };

  brightMat.uniforms.tSrc.value = rtScene.texture;             // 3. bloom in three sizes
  runPass(brightMat, rtBright);
  let blurred = rtBright;
  for (const [a, b] of rtBlur) {
    blurMat.uniforms.tSrc.value = blurred.texture; blurMat.uniforms.uDir.value.set(1 / a.width, 0); runPass(blurMat, a);
    blurMat.uniforms.tSrc.value = a.texture; blurMat.uniforms.uDir.value.set(0, 1 / a.height); runPass(blurMat, b);
    blurred = b;
  }

  // 4. shafts, aimed at wherever the moon is on screen, and faded out as it leaves the frame
  camera.getWorldDirection(_a);
  moonPoint.copy(camera.position).addScaledVector(moonDir, 500).project(camera);
  const offscreen = Math.max(Math.abs(moonPoint.x), Math.abs(moonPoint.y));
  compositeMat.uniforms.uShaft.value = _a.dot(moonDir) > 0 ? clamp(1.5 - offscreen, 0, 1) * 0.9 : 0;
  shaftMat.uniforms.tSrc.value = rtBright.texture;
  shaftMat.uniforms.tDepth.value = rtScene.depthTexture;
  shaftMat.uniforms.uLight.value.set(moonPoint.x * 0.5 + 0.5, moonPoint.y * 0.5 + 0.5);
  shaftMat.uniforms.uAspect.value = viewW / viewH;
  runPass(shaftMat, rtShaft);

  viewProjection.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).invert();
  compositeMat.uniforms.tScene.value = rtScene.texture;
  compositeMat.uniforms.tBloom0.value = rtBlur[0][1].texture;
  compositeMat.uniforms.tBloom1.value = rtBlur[1][1].texture;
  compositeMat.uniforms.tBloom2.value = rtBlur[2][1].texture;
  compositeMat.uniforms.tShaft.value = rtShaft.texture;
  compositeMat.uniforms.tDepth.value = rtScene.depthTexture;
  compositeMat.uniforms.uInvViewProj.value.copy(viewProjection);
  compositeMat.uniforms.uCamPos.value.copy(camera.position);
  compositeMat.uniforms.uResolution.value.set(viewW, viewH);
  runPass(compositeMat, null);                                 // 5. to the screen
}

// ---------------------------------------------------------------- 10. camera and views
// The camera orbits a target in spherical coordinates, with damping. Each of the three views is one
// such pose; dragging, the wheel and pinching move away from it within limits. When nothing has
// happened for a few seconds the view starts to wander, very slowly.
// `spring` stands in the stream and looks upstream at the moon; `moon` looks up along the moonlight
// through the canopy; `pines` perches above the water, among the crowns, and looks down the stream.
const VIEWS = {
  spring: { target: [CAM0.x, 1.05, -6.5], yaw: 0, pitch: Math.asin((CAM0.y - 1.05) / 13.6) / DEG, dist: 13.6, fov: 46, minPitch: 0.6, maxPitch: 26 },
  moon: { target: [2.0, 1.5, 4.5].map((v, i) => v + 6 * moonDir.getComponent(i)), yaw: -MOON_AZ / DEG, pitch: -MOON_EL / DEG, dist: 6, fov: 50, minPitch: -34, maxPitch: 14 },
  pines: { target: [-0.3, 3.6, -12], yaw: 2.23, pitch: 7.78, dist: 20.7, fov: 54, minPitch: 2, maxPitch: 24 },
};
const orbit = { yaw: 0, pitch: 0, dist: 10, fov: 46, target: new THREE.Vector3() };     // where the camera is
const goal = { yaw: 0, pitch: 0, dist: 10, target: new THREE.Vector3() };              // where it is heading
const anchor = { yaw: 0, pitch: 0, dist: 10 };                                          // the centre of its slow wander
const limit = { minPitch: 0, maxPitch: 0, minYaw: 0, maxYaw: 0, minDist: 3, maxDist: 40 };
const flight = { active: false, t: 0, from: { yaw: 0, pitch: 0, dist: 0, fov: 0, target: new THREE.Vector3() }, to: null };
let currentView = VIEWS.spring;
let drift = !REDUCED, lastInput = 0, dragging = false;

const clampGoal = () => {
  goal.yaw = clamp(goal.yaw, limit.minYaw, limit.maxYaw);
  goal.pitch = clamp(goal.pitch, limit.minPitch, limit.maxPitch);
  goal.dist = clamp(goal.dist, limit.minDist, limit.maxDist);
};
// Interrupting a flight or a wander leaves the camera where it is, so nothing jumps.
const holdStill = () => { flight.active = false; goal.yaw = orbit.yaw; goal.pitch = orbit.pitch; goal.dist = orbit.dist; };

function setView(name, instant = false) {
  const v = VIEWS[name];
  if (!v) return;
  currentView = v;
  limit.minPitch = v.minPitch * DEG; limit.maxPitch = v.maxPitch * DEG;
  limit.minYaw = v.yaw * DEG - 75 * DEG; limit.maxYaw = v.yaw * DEG + 75 * DEG;
  limit.minDist = Math.max(3, v.dist * 0.42); limit.maxDist = v.dist * 1.7;
  const to = { yaw: v.yaw * DEG, pitch: v.pitch * DEG, dist: v.dist, fov: v.fov, target: new THREE.Vector3(...v.target) };
  Object.assign(anchor, to);                       // of which it takes yaw, pitch and dist
  goal.target.copy(to.target);
  if (instant) {
    Object.assign(goal, to);
    Object.assign(orbit, to, { target: to.target.clone() });
    flight.active = false;
  } else {
    flight.from.yaw = orbit.yaw - TAU * Math.round((orbit.yaw - to.yaw) / TAU);      // fly the short way round
    flight.from.pitch = orbit.pitch; flight.from.dist = orbit.dist; flight.from.fov = orbit.fov;
    flight.from.target.copy(orbit.target);
    flight.to = to; flight.t = 0; flight.active = true;
  }
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('is-active', b.dataset.view === name));
  lastInput = time;                                               // the wander starts counting from here
}

function updateCamera(dt, t) {
  if (flight.active) {
    const f = flight, k = smoothstep(0, 1, f.t);
    orbit.yaw = lerp(f.from.yaw, f.to.yaw, k); orbit.pitch = lerp(f.from.pitch, f.to.pitch, k);
    orbit.dist = lerp(f.from.dist, f.to.dist, k); orbit.fov = lerp(f.from.fov, f.to.fov, k);
    orbit.target.lerpVectors(f.from.target, f.to.target, k);
    Object.assign(goal, { yaw: orbit.yaw, pitch: orbit.pitch, dist: orbit.dist });
    f.t = Math.min(1, f.t + dt / 2.8);
    if (f.t >= 1) flight.active = false;
  } else {
    const idle = t - lastInput;
    if (drift && !dragging && idle > 3.5) {         // ease the wander in over the seven seconds after that
      const w = smoothstep(0, 7, idle - 3.5);
      goal.yaw = anchor.yaw + Math.sin(idle * 0.11) * 3.2 * DEG * w;
      goal.pitch = anchor.pitch + Math.sin(idle * 0.083 + 1.3) * 1.0 * DEG * w;
      goal.dist = anchor.dist * (1 + 0.03 * Math.sin(idle * 0.05) * w);
    }
    const k = 1 - Math.exp(-dt * 7);
    orbit.yaw += (goal.yaw - orbit.yaw) * k;
    orbit.pitch += (goal.pitch - orbit.pitch) * k;
    orbit.dist += (goal.dist - orbit.dist) * k;
    orbit.fov += (currentView.fov - orbit.fov) * k;
    orbit.target.lerp(goal.target, k);
  }
  place();
}

function place() {
  const cp = Math.cos(orbit.pitch), aspect = Math.max(innerWidth, 1) / Math.max(innerHeight, 1);
  const x = orbit.target.x + orbit.dist * Math.sin(orbit.yaw) * cp;
  const z = orbit.target.z + orbit.dist * Math.cos(orbit.yaw) * cp;
  const y = Math.max(orbit.target.y + orbit.dist * Math.sin(orbit.pitch), heightAt(x, z) + 0.7, 0.55);   // never in the ground or under the water
  camera.position.set(x, y, z);
  camera.lookAt(orbit.target);
  // On a tall screen the horizontal field would get too narrow, so below 56° the vertical field opens instead.
  const wide = Math.atan(Math.tan((orbit.fov * DEG) / 2) * aspect);
  camera.fov = wide < 28 * DEG ? Math.min(78, (2 * Math.atan(Math.tan(28 * DEG) / aspect)) / DEG) : orbit.fov;
  camera.aspect = aspect;
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();       // the shafts are aimed before the frame's first pass
  sky.position.copy(camera.position);
}

// Input: a pointer (mouse or touch) orbits, two pointers pinch, the wheel zooms.
const canvas = renderer.domElement;
const pointers = new Map();
let pinch = 0;
const pinchDistance = () => { const [p, q] = [...pointers.values()]; return Math.hypot(p[0] - q[0], p[1] - q[1]) || 1; };
const interact = () => { lastInput = time; $('hint').classList.add('is-hidden'); };

canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  canvas.setPointerCapture(e.pointerId);
  dragging = true;
  canvas.classList.add('is-dragging');
  interact();
  holdStill();
  pinch = pointers.size === 2 ? pinchDistance() : 0;
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  interact();
  if (pointers.size === 1) {
    const speed = ((camera.fov * DEG) / Math.max(innerHeight, 1)) * 1.3;     // a drag across the height turns about one and a quarter fields
    goal.yaw -= (e.clientX - prev[0]) * speed;
    goal.pitch += (e.clientY - prev[1]) * speed;
  } else if (pointers.size === 2) {
    const d = pinchDistance();
    if (pinch) goal.dist *= pinch / d;
    pinch = d;
  }
  clampGoal();
  Object.assign(anchor, { yaw: goal.yaw, pitch: goal.pitch, dist: goal.dist });   // wander from wherever the view is left
});
const release = (e) => {
  pointers.delete(e.pointerId);
  pinch = 0;
  if (!pointers.size) { dragging = false; canvas.classList.remove('is-dragging'); }
};
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  interact();
  holdStill();
  goal.dist *= Math.exp((e.deltaMode === 1 ? e.deltaY * 33 : e.deltaY) * 0.0012);
  clampGoal();
  anchor.dist = goal.dist;
}, { passive: false });

// ---------------------------------------------------------------- 11. ui, sound, main loop
// The sound of the stream, synthesised: noise in three bands that wander a little, and a scatter of
// small bubbles. Nothing is downloaded, and it only starts when asked for.
class StreamSound {
  constructor() { this.ctx = null; this.on = false; this.timer = 0; }
  toggle() { if (this.on) this.stop(); else this.start(); return this.on; }
  start() {
    if (!this.ctx) this.build();
    this.ctx.resume();
    this.on = true;
    this.master.gain.setTargetAtTime(0.55, this.ctx.currentTime, 0.9);
    this.bubble();
  }
  stop() {
    this.on = false;
    clearTimeout(this.timer);
    this.master.gain.setTargetAtTime(0, this.ctx.currentTime, 0.35);
  }
  build() {
    const C = new (window.AudioContext || window.webkitAudioContext)();
    this.ctx = C;
    this.master = C.createGain();
    this.master.gain.value = 0;
    this.master.connect(C.destination);
    const buffer = C.createBuffer(1, C.sampleRate * 4, C.sampleRate), data = buffer.getChannelData(0);
    const rng = mulberry32(161);
    for (let i = 0; i < data.length; i++) data[i] = rng() * 2 - 1;
    this.out = (node, pan) => {                                 // each band sits a little to one side or the other
      if (!C.createStereoPanner) return node.connect(this.master);
      const p = C.createStereoPanner(); p.pan.value = pan; node.connect(p); p.connect(this.master);
    };
    const layer = (type, freq, q, gain, pan, lfoRate, lfoDepth) => {
      const src = C.createBufferSource(), f = C.createBiquadFilter(), g = C.createGain(), lfo = C.createOscillator(), lg = C.createGain();
      src.buffer = buffer; src.loop = true;
      f.type = type; f.frequency.value = freq; f.Q.value = q;
      g.gain.value = gain;
      lfo.frequency.value = lfoRate; lg.gain.value = lfoDepth;
      lfo.connect(lg); lg.connect(f.frequency);                   // the band drifts up and down: the water never holds one note
      src.connect(f); f.connect(g); this.out(g, pan);
      src.start(); lfo.start();
    };
    layer('lowpass', 340, 0.5, 0.5, 0, 0.07, 60);                // the body of the fall
    layer('bandpass', 820, 0.8, 0.6, -0.35, 0.11, 260);          // the murmur
    layer('bandpass', 2500, 0.9, 0.22, 0.4, 0.083, 900);         // the hiss over the stones
  }
  bubble() {
    clearTimeout(this.timer);
    if (!this.on) return;
    const C = this.ctx, t = C.currentTime + Math.random() * 0.05, f = 700 + Math.random() * 1900;
    const o = C.createOscillator(), g = C.createGain();
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * (1.4 + Math.random() * 0.6), t + 0.03 + Math.random() * 0.06);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.03 + Math.random() * 0.05, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0005, t + 0.06 + Math.random() * 0.1);
    o.connect(g); this.out(g, Math.random() * 1.6 - 0.8);
    o.start(t); o.stop(t + 0.2);
    this.timer = setTimeout(() => this.bubble(), 45 + Math.random() * 260);
  }
}
const sound = new StreamSound();
const toggleSound = () => $('btn-sound').setAttribute('aria-pressed', String(sound.toggle()));
const toggleDrift = () => { drift = !drift; $('btn-drift').setAttribute('aria-pressed', String(drift)); };
function toggleFullscreen() {
  const el = document.documentElement, exit = document.exitFullscreen || document.webkitExitFullscreen, enter = el.requestFullscreen || el.webkitRequestFullscreen;
  const settled = (p) => { if (p && p.catch) p.catch(() => {}); };          // being refused is not an error worth showing
  if (document.fullscreenElement || document.webkitFullscreenElement) settled(exit.call(document));
  else if (enter) settled(enter.call(el));
}
if (document.fullscreenEnabled || document.webkitFullscreenEnabled) $('btn-fullscreen').classList.remove('is-gone');
$('btn-drift').setAttribute('aria-pressed', String(drift));
for (const [id, action] of [['btn-drift', toggleDrift], ['btn-sound', toggleSound], ['btn-fullscreen', toggleFullscreen]]) {
  $(id).addEventListener('click', (e) => { action(); e.currentTarget.blur(); });     // blurred again, so Space keeps meaning "pause the wander"
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { setView(b.dataset.view); b.blur(); }));
const VIEW_KEYS = { Digit1: 'spring', Digit2: 'moon', Digit3: 'pines', Numpad1: 'spring', Numpad2: 'moon', Numpad3: 'pines' };
window.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (VIEW_KEYS[e.code]) setView(VIEW_KEYS[e.code]);
  else if (e.code === 'Space') { e.preventDefault(); toggleDrift(); }
  else if (e.code === 'KeyM') toggleSound();
  else if (e.code === 'KeyF') toggleFullscreen();
});
if (matchMedia('(pointer: coarse)').matches) $('hint').textContent = '拖动环视 · 双指缩放 · 点按下方切换视角';

// `renderScale` steps down when frames run long and back up when they do not (see adapt, below).
function resize() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight);
  const pixels = Math.min(Math.min(window.devicePixelRatio || 1, 2), Math.sqrt(2600000 / (w * h))) * renderScale;   // at most 2x, and about 2.6 megapixels
  viewW = Math.max(2, Math.round(w * pixels)); viewH = Math.max(2, Math.round(h * pixels));
  renderer.setPixelRatio(1);
  renderer.setSize(viewW, viewH, false);
  allocateTargets();
  waterUniforms.uResolution.value.set(viewW, viewH);
  motes.material.uniforms.uScale.value = (14 * viewH) / 1080;            // motes keep their size in pixels at any resolution
  place();
}
let slowTime = 0, counted = 0;
function adapt(dt, t) {
  if (STILL || params.has('scale') || t < 5) return;     // not for a still frame, nor with a scale set by hand,
                                                        // nor in the first seconds, while shaders are still compiling
  slowTime += dt; counted++;
  if (counted < 50) return;
  const avg = slowTime / counted;
  slowTime = 0; counted = 0;
  if (avg > 0.03 && renderScale > 0.55) { renderScale = Math.max(0.55, renderScale * 0.85); resize(); }
  else if (avg < 0.014 && renderScale < 1) { renderScale = Math.min(1, renderScale * 1.1); resize(); }
}

// The clock starts a little way in, so the water is already moving when the loader lifts.
let time = params.has('t') ? parseFloat(params.get('t')) || 0 : 14;
lastInput = time;
if (params.has('scale')) renderScale = clamp(parseFloat(params.get('scale')) || 1, 0.25, 1);
setView(VIEWS[params.get('view')] ? params.get('view') : 'spring', true);
resize();
window.addEventListener('resize', resize);
updateLeaves(time);
renderer.shadowMap.autoUpdate = false;              // nothing that casts a shadow ever moves, so the map is drawn once
renderer.shadowMap.needsUpdate = true;

let last = performance.now(), presented = false, frozen = false;
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05);
  last = now;
  if (!STILL) time += dt;
  skyUniforms.uTime.value = time;
  waterUniforms.uTime.value = time;
  windUniform.value = REDUCED ? 0 : 0.006;
  updateLeaves(time);
  if (!frozen) updateCamera(dt, time);
  render();
  adapt(dt, time);
  if (!presented) {
    presented = true;
    $('loader').classList.add('is-hidden');
    document.body.classList.add('is-ready');
  }
}
const loop = (now) => { frame(now); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
setInterval(() => { if (performance.now() - last > 200) frame(performance.now()); }, 50);   // keeps frames coming where rAF is withheld

if (DEBUG) {
  window.__moon = {
    THREE, scene, camera, renderer, water, terrain, forest, textures: tex, views: VIEWS, setView,
    lights: [moonLight, bounce], night: NIGHT, post: compositeMat.uniforms, shaft: shaftMat.uniforms, bright: brightMat.uniforms,
    sprays, freeze: (on) => { frozen = on; }, render,
    setTime: (t) => { time = t; },
    stats: () => ({ passes: passInfo, width: viewW, height: viewH, scale: renderScale, sprays: sprays.count }),
  };
}
}

main().catch((err) => {
  console.error(err);
  showError(err && err.friendly ? err.message : `场景没能建立起来：${(err && err.message) || err}`);
});
</script>
</body>
